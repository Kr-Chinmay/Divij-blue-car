    bubble.setData('phase', Phaser.Math.FloatBetween(0, Math.PI * 2));

    // Swell into view rather than simply appearing at the top edge.
    bubble.setScale(0.35);
    this.tweens.add({ targets: bubble, scale: 1, duration: 380, ease: 'Back.easeOut' });

    // Adding it to the physics group gives it a physics body automatically.
    this.bubbles.add(bubble);

    // A round body, centred on the container, so the collision matches the
    // artwork instead of being a square around it. Bad ones get a slightly
    // smaller circle than they look, so a near miss counts as a miss.
    const bodyR = bad ? R * CONFIG.BAD_HITBOX_FRAC : R;
    bubble.body.setCircle(bodyR, -bodyR, -bodyR);
    bubble.body.setAllowGravity(false);

    // One shared speed for every bubble - see the note by GAP_MIN_PX. The
    // update loop re-applies it every frame as the throttle moves, so they
    // always fall in lockstep and the spacing they spawn with is the
    // spacing they keep, all the way down the screen.
    bubble.body.setVelocityY(CONFIG.BUBBLE_SPEED * this.speedMul);
  }


  /* -------------------------------------------------------------------
     Called by Phaser when the car overlaps a bubble.
     ---------------------------------------------------------------- */
  collectBubble(car, bubble) {
    // Guard: overlap can fire twice in one frame for the same bubble,
    // so ignore it if we've already started collecting this one.
    if (bubble.getData('collected')) return;
    bubble.setData('collected', true);

    // The bubble stops moving and stops counting as a target immediately...
    bubble.body.enable = false;
    bubble.body.setVelocity(0, 0);

    // ...and leaves the group straight away, so it stops counting towards
    // the "how many are on screen" limit while its pop plays out.
    this.bubbles.remove(bubble);

    const bad = bubble.getData('bad');
    const value = bubble.getData('value');

    // Scatter a handful of bits in the bubble's own colour, and float the
    // score change up from where it was hit.
    this.burst(bubble.x, bubble.y, bubble.getData('colour'));
    this.scorePopup(bubble.x, bubble.y, value);

    // Drop the entrance tween if it's somehow still running, or it would
    // fight the pop below and the bubble would never finish shrinking.
    this.tweens.killTweensOf(bubble);

    // ...then swells and fades before removing itself.
    this.tweens.add({
      targets: bubble,
      scale: 1.7,
      alpha: 0,
      duration: 200,
      ease: 'Quad.easeOut',
      onComplete: () => bubble.destroy()
    });

    if (bad) {
      // A dull thud and a jolt of the camera, so hitting a bad one feels
      // like a bump rather than a reward.
      this.sfx.thud();
      this.cameras.main.shake(200, 0.009);
    } else {
      // Bonus bubbles get a brighter, longer chime than an ordinary catch,
      // so a big one sounds like a big one.
      this.sfx.pop(value);
    }

    // One line covers every case: value is +1, +3, +5 or negative.
    this.score += value;
    this.scoreText.setText('Score: ' + this.score);

    // Turn the number red once it's in the negative, so a dropping score is
    // obvious at a glance rather than needing the minus sign to be spotted.
    this.scoreText.setColor(this.score < 0 ? CONFIG.SCORE_NEG_COLOR : CONFIG.SCORE_COLOR);

    // Two bits of visual feedback: the number swells, and the car itself
    // gives a quick squeeze - so you feel the pickup even if you're
    // watching the car rather than the corner of the screen.
    this.bounce(this.scoreText, CONFIG.SCORE_BOUNCE_SCALE, 110);
    this.bounce(this.car,       CONFIG.CAR_BOUNCE_SCALE,    80);
  }


  /* -------------------------------------------------------------------
     A spray of little discs in the popped bubble's colour.

     Each one is an ordinary circle on a tween rather than a Phaser particle
     emitter - emitters need a texture, and this stays closer to how the
     rest of the game is drawn. A collect happens at most once a second or
     so, so ten short-lived circles cost nothing.
     ---------------------------------------------------------------- */
  burst(x, y, colour) {
    for (let i = 0; i < CONFIG.BURST_PARTICLES; i++) {
      // Spread them evenly around the circle, then jitter each one a little
      // so the ring doesn't look mechanical.
      const angle = (Math.PI * 2 * i) / CONFIG.BURST_PARTICLES
                  + Phaser.Math.FloatBetween(-0.25, 0.25);
      const dist = Phaser.Math.Between(CONFIG.BURST_SPEED_MIN, CONFIG.BURST_SPEED_MAX);

      const bit = this.add.circle(x, y, Phaser.Math.Between(5, 10), colour).setDepth(7);

      this.tweens.add({
        targets: bit,
        x: x + Math.cos(angle) * dist,
        y: y + Math.sin(angle) * dist,
        scale: 0,
        alpha: 0,
        duration: Phaser.Math.Between(380, 620),
        ease: 'Quad.easeOut',
        onComplete: () => bit.destroy()
      });
    }
  }


  /* -------------------------------------------------------------------
     A "+1" that drifts up from wherever the bubble was caught.
     ---------------------------------------------------------------- */
  scorePopup(x, y, value) {
    // Bigger wins get bigger, brighter numbers - the feedback should scale
    // with what was actually earned.
    const colour = value < 0 ? CONFIG.SCORE_NEG_COLOR
                 : value >= 5 ? '#ffd54f'
                 : value >= 3 ? '#5ce6d0'
                 : '#ffffff';

    const label = this.add.text(x, y, (value > 0 ? '+' : '') + value, {
      fontFamily: CONFIG.BUBBLE_FONT,
      fontSize: (value > 1 ? 52 : 38) + 'px',
      fontStyle: 'bold',
      color: colour,
      stroke: CONFIG.BUBBLE_STROKE_COLOR,
      strokeThickness: 7
    }).setOrigin(0.5).setDepth(11);

    this.tweens.add({
      targets: label,
      y: y - 90,
      alpha: 0,
      duration: 750,
      ease: 'Quad.easeOut',
      onComplete: () => label.destroy()
    });
  }


  /* -------------------------------------------------------------------
     One puff of exhaust from the back of the car.
     ---------------------------------------------------------------- */
  puff() {
    const p = this.add.circle(
      this.car.x + Phaser.Math.Between(-9, 9),
      this.car.y + CONFIG.CAR_HEIGHT * 0.48,
      Phaser.Math.Between(4, 7),
      0xb9c0cc,
      0.45
    ).setDepth(4);

    // Drift back down the road, growing and thinning out as it goes.
    //
    // A puff hangs in the air while the car drives on, so it should slide
    // backwards at exactly road speed. Deriving the distance from
    // SCROLL_SPEED rather than hardcoding it means the smoke keeps pace
    // automatically whenever the game's speed is retuned.
    const life = Phaser.Math.Between(450, 700);

    this.tweens.add({
      targets: p,
      y: p.y + CONFIG.SCROLL_SPEED * this.speedMul * (life / 1000),
      scale: 2.2,
      alpha: 0,
      duration: life,
      ease: 'Quad.easeOut',
      onComplete: () => p.destroy()
    });
  }


  /* -------------------------------------------------------------------
     A quick "pop out and settle back" on any object.

     Killing any tween already running on the target first matters: collect
     two bubbles in quick succession and the second bounce would otherwise
     fight the first, leaving the object stranded at the wrong size.

     Worth knowing: an Arcade physics body DOES scale with its game object,
     so for the ~80ms the car is bouncing its collision box is up to 18%
     bigger. That only ever happens just after a pickup, and a slightly
     generous car is no bad thing here, so we let it be.
     ---------------------------------------------------------------- */
  bounce(target, peakScale, halfDuration) {
    this.tweens.killTweensOf(target);
    target.setScale(1);

    this.tweens.add({
      targets: target,
      scale: peakScale,
      duration: halfDuration,
      yoyo: true,                    // swell up, then shrink back
      ease: 'Back.easeOut',          // slight overshoot = livelier bounce
      onComplete: () => target.setScale(1)   // guarantee we land exactly at 1
    });
  }


  /* -------------------------------------------------------------------
     Drop a roadside prop somewhere on one of the two grass verges.
     ---------------------------------------------------------------- */
  placeProp(prop, y) {
    const W = this.scale.width;

    // Fresh identity each time round: a tree can come back as a bush.
    prop.setTexture(Phaser.Utils.Array.GetRandom(CONFIG.PROP_KEYS));
    prop.setScale(Phaser.Math.FloatBetween(0.8, 1.15));

    // Work the half-width out AFTER scaling, or a big prop hangs over the
    // edge of the verge and onto the tar.
    const half = prop.displayWidth / 2 + 2;
    const onLeft = Math.random() < 0.5;

    prop.x = onLeft
      ? Phaser.Math.Between(half, Math.max(half, this.roadLeft - half))
      : Phaser.Math.Between(Math.min(W - half, this.roadRight + half), W - half);
    prop.y = y;
  }


  /* -------------------------------------------------------------------
     Fade both fields to a new green.
     ---------------------------------------------------------------- */
  shiftFieldColour() {
    const from = this.currentFieldColour;
    const to = Phaser.Utils.Array.GetRandom(
      CONFIG.FIELD_COLOURS.filter(c => c !== from));

    const cFrom = Phaser.Display.Color.IntegerToColor(from);
    const cTo   = Phaser.Display.Color.IntegerToColor(to);

    // addCounter just tweens a plain number for us; we turn that number
    // into a blend of the two colours on every frame.
    this.tweens.addCounter({
      from: 0,
      to: 100,
      duration: CONFIG.FIELD_FADE_MS,
      onUpdate: tween => {
        const step = Phaser.Display.Color.Interpolate.ColorWithColor(
          cFrom, cTo, 100, tween.getValue());
        const colour = Phaser.Display.Color.GetColor(step.r, step.g, step.b);
        this.fieldLeft.setFillStyle(colour);
        this.fieldRight.setFillStyle(colour);
      },
      onComplete: () => { this.currentFieldColour = to; }
    });
  }


  /* -------------------------------------------------------------------
     Every bubble has been and gone: show the result and the table.
     ---------------------------------------------------------------- */
  showFinishBanner() {
    const W = this.scale.width;
    const H = this.scale.height;

    this.banner = this.add.container(W / 2, H * 0.46).setDepth(20);

    const panel = this.add.rectangle(0, 0, W * 0.90, 560, 0x101a2e, 0.96);
    panel.setStrokeStyle(5, 0xffd54f, 0.95);

    this.titleStyle = {
      fontFamily: CONFIG.BUBBLE_FONT, fontStyle: 'bold',
      color: '#ffffff', stroke: CONFIG.BUBBLE_STROKE_COLOR, strokeThickness: 6,
      align: 'center'
    };

    // The encouragement leads, where "All 100 done!" used to. It says the run
    // is over just as clearly, and says something kinder while it does it.
    const cheer = this.add.text(0, -212, this.encouragementFor(this.score), {
      ...this.titleStyle, fontSize: '26px', color: '#5ce6d0',
      wordWrap: { width: W * 0.78 }
    }).setOrigin(0.5);

    // These messages are sentences, not labels - the longest runs to fifty
    // characters and wraps to three lines. Shrink it to the space rather
    // than trusting one size to suit all four.
    let cheerSize = 26;
    while (cheerSize > 15 && cheer.height > 84) {
      cheerSize -= 1;
      cheer.setFontSize(cheerSize);
    }

    this.banner.add([
      panel,
      cheer,
      this.add.text(0, -130, 'Score: ' + this.score,
                    { ...this.titleStyle, fontSize: '46px', color: '#ffd54f' }).setOrigin(0.5)
    ]);

    const scores = loadHighScores();

    // You make the table if there's still a free place, or if you've beaten
    // whoever is currently bottom of it.
    const madeTheTable = highScoresAvailable()
      && (scores.length < CONFIG.HIGHSCORE_KEEP
          || this.score > scores[scores.length - 1].score);

    if (madeTheTable) {
      this.showNameEntry(scores);
    } else {
      this.showTable(scores, highScoresAvailable()
        ? null : 'This browser will not save scores');
    }
  }


  /* -------------------------------------------------------------------
     Ask who just played.

     A real <input> rather than letters picked with arrows, because it
     brings up the phone's own keyboard - much easier for a grown-up
     typing on a child's behalf. Phaser positions DOM elements in game
     coordinates, so it stays put however the canvas is scaled.
     ---------------------------------------------------------------- */
  showNameEntry(scores) {
    const W = this.scale.width;
    const H = this.scale.height;

    let typed = '';

    this.nameEntry = this.add.container(0, 0).setDepth(40);

    const dim = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.86).setInteractive();
    const panel = this.add.rectangle(W / 2, H * 0.505, W * 0.94, H * 0.89, 0x101a2e, 0.98)
      .setStrokeStyle(5, 0xffd54f, 0.95);

    const style = (size, extra) => ({
      fontFamily: CONFIG.BUBBLE_FONT, fontStyle: 'bold', fontSize: size + 'px',
      color: '#ffffff', stroke: CONFIG.BUBBLE_STROKE_COLOR, strokeThickness: 5,
      ...extra
    });

    const title = this.add.text(W / 2, H * 0.12, 'New high score!',
      style(30, { color: '#ffd54f' })).setOrigin(0.5);
    const scoreLine = this.add.text(W / 2, H * 0.185, 'Score: ' + this.score,
      style(34, { color: '#5ce6d0' })).setOrigin(0.5);

    // The name as it is being built. A drawn box, not an input field.
    const box = this.add.rectangle(W / 2, H * 0.27, W * 0.76, 56, 0x1c2740)
      .setStrokeStyle(4, 0xffd54f, 0.95);
    const shown = this.add.text(W / 2, H * 0.27, 'Who played?', style(26, {
      color: '#9aa4b8', strokeThickness: 3
    })).setOrigin(0.5);

    this.nameEntry.add([dim, panel, title, scoreLine, box, shown]);

    const redraw = () => {
      shown.setText(typed || 'Who played?');
      shown.setColor(typed ? '#ffffff' : '#9aa4b8');
    };

    // --- The letters ------------------------------------------------
    const rows = ['ABCDEFG', 'HIJKLMN', 'OPQRSTU', 'VWXYZ'];
    const keyW = 54, keyH = H * 0.058, pitch = 58;
    const topY = H * 0.365, rowGap = H * 0.077;

    const addKey = (cx, cy, label, colour, onTap) => {
      const k = this.add.rectangle(cx, cy, keyW, keyH, colour)
        .setStrokeStyle(3, 0xffffff, 0.9)
        .setInteractive({ useHandCursor: true });
      const t = this.add.text(cx, cy, label, style(24)).setOrigin(0.5);

      k.on('pointerdown', () => {
        // A little squeeze, so a press on a drawn key still feels like a
        // press. A real keyboard gives that feedback for free.
        this.tweens.killTweensOf(k);
        k.setScale(1);
        this.tweens.add({ targets: k, scale: 1.15, duration: 70, yoyo: true });
        onTap();
      });

      this.nameEntry.add([k, t]);
    };

    rows.forEach((row, r) => {
      // Each row is centred on its own count, so the short last row does not
      // sit hanging off to the left.
      const count = row.length + (r === rows.length - 1 ? 1 : 0);   // + backspace
      const startX = W / 2 - ((count - 1) * pitch) / 2;
      const y = topY + r * rowGap;

      row.split('').forEach((ch, i) => {
        addKey(startX + i * pitch, y, ch, 0x2f6fed, () => {
          if (typed.length < CONFIG.NAME_MAX_LEN) { typed += ch; redraw(); }
        });
      });

      if (r === rows.length - 1) {
        addKey(startX + row.length * pitch, y, '<', 0xff7f6b, () => {
          typed = typed.slice(0, -1); redraw();
        });
      }
    });

    // --- Done -------------------------------------------------------
    const doneY = H * 0.78;
    const done = this.add.rectangle(W / 2, doneY, 240, 66, 0x4caf50)
      .setStrokeStyle(4, 0xffffff, 0.95)
      .setInteractive({ useHandCursor: true });
    const doneLabel = this.add.text(W / 2, doneY, 'Done', style(30)).setOrigin(0.5);

    const hint = this.add.text(W / 2, H * 0.855, 'Leave it blank to be "Player"',
      style(16, { color: '#9aa4b8', strokeThickness: 3 })).setOrigin(0.5);

    done.on('pointerdown', () => {
      const entry = { name: typed.trim() || 'Player', score: this.score };
      const updated = scores.concat(entry)
        .sort((a, b) => b.score - a.score)
        .slice(0, CONFIG.HIGHSCORE_KEEP);

      const stored = saveHighScores(updated);

      this.nameEntry.destroy();
      this.nameEntry = null;

      this.showTable(updated, stored ? null : 'Could not save on this device', entry);
    });

    this.nameEntry.add([done, doneLabel, hint]);
  }


  /* -------------------------------------------------------------------
     Draw the standings into the card.
     ---------------------------------------------------------------- */
  showTable(scores, warning, justAdded) {
    let y = -78;

    this.banner.add(
      this.add.text(0, y, 'Best scores',
                    { ...this.titleStyle, fontSize: '24px', color: '#9aa4b8' }).setOrigin(0.5)
    );
    y += 38;

    if (scores.length === 0) {
      this.banner.add(
        this.add.text(0, y, 'No scores yet',
                      { ...this.titleStyle, fontSize: '22px', color: '#9aa4b8' }).setOrigin(0.5)
      );
      y += 34;
    }

    scores.forEach((entry, i) => {
      // Highlight the run that just finished, so it's obvious where you
      // landed among the rest.
      const isMine = justAdded && entry.name === justAdded.name
                   && entry.score === justAdded.score;
      const colour = isMine ? '#ffd54f' : '#ffffff';

      const row = { ...this.titleStyle, fontSize: '24px', color: colour, strokeThickness: 4 };

      this.banner.add([
        this.add.text(-150, y, (i + 1) + '.', row).setOrigin(0, 0.5),
        this.add.text(-112, y, entry.name, row).setOrigin(0, 0.5),
        this.add.text(150, y, String(entry.score), row).setOrigin(1, 0.5)
      ]);
      y += 34;
    });

    if (warning) {
      this.banner.add(
        this.add.text(0, y + 6, warning,
                      { ...this.titleStyle, fontSize: '17px', color: '#ff9d9d',
                        strokeThickness: 3 }).setOrigin(0.5)
      );
    }

    this.addEndButtons();
  }


  /* -------------------------------------------------------------------
     Play again, or go back to the menu.

     These replace a "tap anywhere to play again" line. Tapping anywhere and
     having a button on the same card cannot both work - the tap meant for
     the button would restart the run underneath it - so the loose tap had
     to go for the menu button to exist at all.
     ---------------------------------------------------------------- */
  addEndButtons() {
    const label = (extra) => ({ ...this.titleStyle, fontSize: '22px', ...extra });

    const again = this.add.rectangle(-98, 240, 178, 56, 0x4caf50)
      .setStrokeStyle(4, 0xffffff, 0.95);
    const againLabel = this.add.text(-98, 240, 'Play Again', label()).setOrigin(0.5);

    const menu = this.add.rectangle(98, 240, 178, 56, 0x4fc3f7)
      .setStrokeStyle(4, 0xffffff, 0.95);
    const menuLabel = this.add.text(98, 240, 'Main Menu', label()).setOrigin(0.5);

    this.banner.add([again, againLabel, menu, menuLabel]);

    // Deliberately dead for a moment. A finger still dragging the car as the
    // card appears would otherwise land on whichever button it happened to
    // be over, and the run would end up restarted by accident.
    this.time.delayedCall(600, () => {
      again.setInteractive({ useHandCursor: true });
      menu.setInteractive({ useHandCursor: true });

      again.on('pointerdown', () => this.resetRun());
      menu.on('pointerdown', () => this.scene.start('HomeScene'));
    });
  }


  /* -------------------------------------------------------------------
     Freeze the run.

     Not Phaser's own scene.pause(), which stops the scene's input along
     with everything else - the Resume button would be dead on arrival. A
     flag of our own stops the world while leaving the overlay tappable.
     ---------------------------------------------------------------- */
  pauseGame() {
    if (this.paused || this.finished) return;
    this.paused = true;

    this.physics.pause();        // bubbles stop falling
    this.time.paused = true;     // spawns and the scenery timers stop
    this.tweens.pauseAll();      // and nothing finishes an animation mid-freeze

    // Drop the engine to idle. Left alone it would hold whatever note it
    // was revving at, droning under a stationary picture.
    this.sfx.setEngineLoad(0);

    const W = this.scale.width;
    const H = this.scale.height;

    this.pauseCard = this.add.container(W / 2, H * 0.44).setDepth(30);

    // Interactive so it swallows every tap meant for the game underneath.
    const dim = this.add.rectangle(0, 0, W * 2, H * 2, 0x000000, 0.72).setInteractive();

    const card = this.add.rectangle(0, 0, W * 0.82, 300, 0x101a2e, 0.97)
      .setStrokeStyle(5, 0xffd54f, 0.95);

    const label = (size, extra) => ({
      fontFamily: CONFIG.BUBBLE_FONT, fontStyle: 'bold', fontSize: size + 'px',
      color: '#ffffff', stroke: CONFIG.BUBBLE_STROKE_COLOR, strokeThickness: 6,
      ...extra
    });

    const title = this.add.text(0, -104, 'Paused', label(38, { color: '#ffd54f' })).setOrigin(0.5);

    const resume = this.add.rectangle(0, -18, 230, 66, 0x4caf50)
      .setStrokeStyle(4, 0xffffff, 0.95).setInteractive({ useHandCursor: true });
    const resumeLabel = this.add.text(0, -18, 'Resume', label(28)).setOrigin(0.5);

    const menu = this.add.rectangle(0, 72, 230, 60, 0x4fc3f7)
      .setStrokeStyle(4, 0xffffff, 0.95).setInteractive({ useHandCursor: true });
    const menuLabel = this.add.text(0, 72, 'Main Menu', label(26)).setOrigin(0.5);

    resume.on('pointerdown', () => this.resumeGame());

    menu.on('pointerdown', () => {
      // Unfreeze the clock and the tweens before leaving. The scene is about
      // to be torn down and rebuilt, but leaving a paused clock behind is the
      // kind of thing that comes back as a mystery later.
      this.time.paused = false;
      this.tweens.resumeAll();
      this.scene.start('HomeScene');
    });

    this.pauseCard.add([dim, card, title, resume, resumeLabel, menu, menuLabel]);
  }

  resumeGame() {
    if (!this.paused) return;
    this.paused = false;

    if (this.pauseCard) {
      this.pauseCard.destroy();
      this.pauseCard = null;
    }

    this.physics.resume();
    this.time.paused = false;
    this.tweens.resumeAll();
  }


  /* -------------------------------------------------------------------
     Pick the parting message for a score.

     Walks the bands in order and takes the first the score fits inside, so
     the boundaries resolve the way the ranges read: 50 belongs to the first
     band, not the second. The final band has no ceiling and catches
     everything above, including a perfect 160.
     ---------------------------------------------------------------- */
  encouragementFor(score) {
    const bands = CONFIG.ENCOURAGEMENTS;
    for (const band of bands) {
      if (band.upTo === undefined || score <= band.upTo) return band.text;
    }
    return bands[bands.length - 1].text;
  }


  /* -------------------------------------------------------------------
     Start a fresh run of 200 without reloading the scene - that way the
     sound stays set up exactly as it is (restarting the scene would build
     a second road hum on top of the first).
     ---------------------------------------------------------------- */
  resetRun() {
    if (this.banner) {
      this.banner.destroy();
      this.banner = null;
    }

    // The name entry is its own overlay rather than part of the card, so it
    // needs clearing separately if a run is restarted while it is open.
    if (this.nameEntry) {
      this.nameEntry.destroy();
      this.nameEntry = null;
    }

    this.score = 0;
    this.scoreText.setText('Score: 0');
    this.scoreText.setColor(CONFIG.SCORE_COLOR);   // clear any red from last run
    this.finished = false;

    this.buildDeck();
    this.distanceSinceSpawn = 0;
    this.nextGapPx = Phaser.Math.Between(CONFIG.GAP_MIN_PX, CONFIG.GAP_MAX_PX);

    // Back to gear 1, so a new run always starts at a speed he chose to
    // leave rather than one left over from the last go.
    this.setGear(1);
  }


  /* -------------------------------------------------------------------
     Runs every frame (~60 times a second).
     `delta` is milliseconds since the previous frame.
     ---------------------------------------------------------------- */
  update(time, delta) {
    // Everything below drives the world: steering, scrolling, spawning,
    // the engine note. Stopping here is what actually makes pause a pause -
    // physics and the clock are frozen too, but this is the loop that would
    // otherwise keep the car chasing a finger across a still picture.
    if (this.paused) return;

    const H = this.scale.height;

    const W = this.scale.width;

    // --- 0. Gear ----------------------------------------------------
    // A finger already down on the selector can slide between notches, so
    // it works either as three buttons or as a little gear lever.
    if (this.sliderPointerId !== null) {
      const held = this.input.manager.pointers.find(p => p && p.id === this.sliderPointerId);
      if (held && held.isDown) {
        const g = this.gearFromY(held.y);
        if (g !== this.gear) this.setGear(g);
      }
    }

    // Ease towards the gear's speed instead of snapping to it, so changing
    // gear pulls away smoothly rather than jolting the whole screen.
    this.speedMul = Phaser.Math.Linear(
      this.speedMul, this.targetSpeedMultiplier(), CONFIG.SPEED_EASE);

    // The number rides along with the knob while it slides between notches.
    this.gearLabel.y = this.sliderKnob.y;

    const halfW = CONFIG.CAR_WIDTH  / 2;
    const halfH = CONFIG.CAR_HEIGHT / 2;
    const carMinX = this.roadLeft  + halfW;
    const carMaxX = this.roadRight - halfW;

    // --- 1. Work out where the car should be ------------------------
    const pointer = this.steeringPointer();

    if (pointer && this.pointerReady) {
      // Map the touchable width (everything right of the slider) onto the
      // full width of the road. A thumb that can only reach the right of
      // the screen can still put the car on the left kerb.
      const across = Phaser.Math.Clamp(
        (pointer.x - CONFIG.SLIDER_ZONE_W) / (W - CONFIG.SLIDER_ZONE_W), 0, 1);
      this.targetX = Phaser.Math.Linear(carMinX, carMaxX, across);

      // THE KEY BIT: sit FINGER_OFFSET_Y pixels above the touch point,
      // so a fingertip never sits on top of the car.
      this.targetY = pointer.y - CONFIG.FINGER_OFFSET_Y;
    }

    // Keep the car on the tar, and never let it climb too high.
    this.targetX = Phaser.Math.Clamp(this.targetX, carMinX, carMaxX);
    this.targetY = Phaser.Math.Clamp(this.targetY, H * CONFIG.CAR_MIN_Y_FRAC, H - halfH);

    // --- 2. Glide towards that target -------------------------------
    // Linear interpolation: move a fraction of the remaining distance each
    // frame. That gives smooth movement instead of a jittery teleport.
    const prevX = this.car.x;
    const prevY = this.car.y;

    this.car.x = Phaser.Math.Linear(this.car.x, this.targetX, CONFIG.CAR_FOLLOW_SPEED);
    this.car.y = Phaser.Math.Linear(this.car.y, this.targetY, CONFIG.CAR_FOLLOW_SPEED);

    // --- 2b. Let the engine follow how hard you're driving -----------
    // Distance covered this frame, converted to pixels per second. Guarding
    // the divide matters: delta can be 0 on the very first frame, and
    // dividing by it would hand the engine an Infinity.
    const moved = Phaser.Math.Distance.Between(prevX, prevY, this.car.x, this.car.y);
    const pxPerSec = moved / (Math.max(delta, 1) / 1000);

    // Smooth towards the new value rather than jumping to it, or the engine
    // note flutters on every little frame-to-frame wobble.
    this.swerveLoad = Phaser.Math.Linear(
      this.swerveLoad,
      Phaser.Math.Clamp(pxPerSec / CONFIG.ENGINE_MAX_PXPS, 0, 1),
      0.12
    );

    // The engine answers to the gear first and to swerving second - it
    // should roar because you changed up, not only because you jinked.
    const topGear = CONFIG.GEAR_SPEEDS[CONFIG.GEAR_SPEEDS.length - 1];
    const throttleNorm = (this.speedMul - 1) / (topGear - 1);
    this.engineLoad = Phaser.Math.Clamp(
      throttleNorm * 0.8 + this.swerveLoad * 0.4, 0, 1);

    this.sfx.setEngineLoad(this.engineLoad);

    // --- 2bb. Speedometer -------------------------------------------
    // The needle reads the world's actual speed, so changing gear visibly
    // moves it. Swerving still adds a little on top.
    const kph = CONFIG.GAUGE_CRUISE_KPH * this.speedMul
              + this.swerveLoad * CONFIG.GAUGE_SWERVE_KPH;

    // Where that speed sits on the dial, as 0..1 of full scale, then mapped
    // onto the needle's sweep either side of straight up. Clamped so a
    // retuned speed range can never swing the needle off the dial.
    const fullScale = Phaser.Math.Clamp(kph / CONFIG.GAUGE_MAX_KPH, 0, 1);
    this.gaugeNeedle.rotation = Phaser.Math.DegToRad(
      -CONFIG.GAUGE_SWEEP / 2 + fullScale * CONFIG.GAUGE_SWEEP
    );
    this.gaugeText.setText(Math.round(kph));

    // --- 2c. Shadow and exhaust -------------------------------------
    // The shadow tracks the car, offset a little so the light reads as
    // coming from the front-left, and matches its bounce.
    this.carShadow.x = this.car.x + 5;
    this.carShadow.y = this.car.y + 9;
    this.carShadow.setScale(this.car.scaleX, this.car.scaleY);

    // Puff more often the harder the engine is working. The 0.35 floor
    // keeps a slow idle trickle going even when you're not moving.
    this.exhaustTimer -= delta * (0.35 + this.engineLoad);
    if (this.exhaustTimer <= 0) {
      this.exhaustTimer = CONFIG.EXHAUST_MS;
      this.puff();
    }

    // --- 3. Scroll the scenery to fake forward motion ---------------
    const scroll = CONFIG.SCROLL_SPEED * this.speedMul * (delta / 1000);

    this.laneDashes.forEach(dash => {
      dash.y += scroll;
      if (dash.y > H + 40) dash.y = -40;    // wrap back to the top
    });

    this.props.forEach(prop => {
      prop.y += scroll * 0.85;   // a little slower than the road = depth
      // Recycle with a random extra gap above the screen, so props arrive
      // occasionally rather than in a steady procession.
      if (prop.y > H + 60) {
        this.placeProp(prop, -60 - Phaser.Math.Between(0, CONFIG.PROP_GAP_MAX));
      }
    });

    // --- 3a. Bubbles fall at the world's current speed ---------------
    // Every bubble is set to the SAME speed every frame. That's what keeps
    // the gaps between them fixed while you brake and accelerate: they all
    // change together, so nothing can close on the one ahead.
    const bubbleSpeed = CONFIG.BUBBLE_SPEED * this.speedMul;
    this.bubbles.getChildren().forEach(b => {
      if (b.body && b.body.enable) b.body.setVelocityY(bubbleSpeed);
    });

    // Spawn once enough ROAD has gone by, rather than once enough time has.
    // Distance is the thing the spacing actually depends on, so measuring it
    // directly keeps bubbles apart at any speed.
    if (this.deck.length > 0) {
      this.distanceSinceSpawn += bubbleSpeed * (delta / 1000);

      if (this.distanceSinceSpawn >= this.nextGapPx
          && this.bubbles.getLength() < CONFIG.MAX_ACTIVE_BUBBLES) {
        this.spawnBubble();
        this.distanceSinceSpawn = 0;
        this.nextGapPx = Phaser.Math.Between(CONFIG.GAP_MIN_PX, CONFIG.GAP_MAX_PX);
      }
    }

    // --- 3b. Let the bubbles float ----------------------------------
    // This drifts the artwork INSIDE each bubble, never the bubble itself,
    // so the physics circle stays exactly where Arcade put it. Each bubble
    // gets its own phase offset so they don't all sway in unison.
    const sway = (time / CONFIG.BUBBLE_SWAY_MS) * Math.PI * 2;
    this.bubbles.getChildren().forEach(bubble => {
      const inner = bubble.getData('inner');
      if (!inner) return;
      const phase = bubble.getData('phase');
      inner.x = Math.sin(sway + phase) * CONFIG.BUBBLE_SWAY_X;
      inner.y = Math.cos((sway + phase) * 1.6) * CONFIG.BUBBLE_BOB_Y;
    });

    // --- 4. Tidy up bubbles that fell off the bottom ----------------
    // Without this they'd pile up forever and eventually slow the game down.
    // We iterate a copy, because destroy() removes the bubble from the very
    // array we'd otherwise be walking.
    this.bubbles.getChildren().slice().forEach(bubble => {
      if (bubble.y > H + CONFIG.BUBBLE_RADIUS * 2) bubble.destroy();
    });

    // --- 5. Was that the last of the 200? ---------------------------
    if (!this.finished && this.deck.length === 0 && this.bubbles.getLength() === 0) {
      this.finished = true;
      this.showFinishBanner();
    }
  }
}


/* ---------------------------------------------------------------------
   5. THE HOME SCREEN
   The first thing the app shows: the logo, the name, a kind word, and a
   button. Kept as its own Scene rather than an overlay inside the game,
   so the game itself starts from a clean slate every time it is entered.
   ------------------------------------------------------------------ */
class HomeScene extends Phaser.Scene {

  constructor() {
    super('HomeScene');
  }

  create() {
    const W = this.scale.width;
    const H = this.scale.height;

    // --- A quiet version of the road, so arriving in the game feels like
    // --- carrying on rather than jumping somewhere else --------------
    const roadLeft  = W * CONFIG.SIDE_STRIP_FRAC;
    const roadRight = W * (1 - CONFIG.SIDE_STRIP_FRAC);

    this.add.rectangle(W / 2, H / 2, W, H, CONFIG.FIELD_COLOURS[0]);
    this.add.rectangle(W / 2, H / 2, roadRight - roadLeft, H, CONFIG.ROAD_COLOR);
    this.add.rectangle(roadLeft + 3,  H / 2, 4, H, CONFIG.EDGE_LINE_COLOR, 0.75);
    this.add.rectangle(roadRight - 3, H / 2, 4, H, CONFIG.EDGE_LINE_COLOR, 0.75);
    for (let y = 40; y < H; y += 90) {
      this.add.rectangle(W / 2, y, 7, 46, CONFIG.LANE_COLOR, 0.9);
    }

    // --- Logo -------------------------------------------------------
    // Drawn to an ordinary canvas by logo.js, then handed to Phaser as a
    // texture. Same code as the launcher icon, so the two always match.
    const logoPx = 260;
    if (!this.textures.exists('logo')) {
      const canvas = document.createElement('canvas');
      canvas.width = logoPx;
      canvas.height = logoPx;
      window.MiniDriverLogo.drawLogo(canvas.getContext('2d'), logoPx, false);
      this.textures.addCanvas('logo', canvas);
    }

    const logo = this.add.image(W / 2, H * 0.26, 'logo').setDisplaySize(170, 170);

    // A slow breathing float, so the screen isn't dead still while a child
    // works out what to do.
    this.tweens.add({
      targets: logo, y: logo.y - 10, duration: 1800,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    // --- Name -------------------------------------------------------
    // Two lines: the full name on one line would have to shrink to about
    // 20px to fit 450 across, which is smaller than the score.
    const titleStyle = {
      fontFamily: CONFIG.BUBBLE_FONT, fontStyle: 'bold',
      color: '#ffffff', stroke: CONFIG.BUBBLE_STROKE_COLOR, strokeThickness: 7,
      align: 'center'
    };

    this.add.text(W / 2, H * 0.455, 'Mini Driver,',
                  { ...titleStyle, fontSize: '40px' }).setOrigin(0.5);
    this.add.text(W / 2, H * 0.515, 'Mega Values',
                  { ...titleStyle, fontSize: '40px', color: '#ffd54f' }).setOrigin(0.5);

    // --- "Made with (heart) for Kids" -------------------------------
    // The heart is a drawn shape, not a typed character. A glyph would be
    // at the mercy of whatever font the phone happens to have; a shape
    // always renders.
    this.buildHeartTexture();

    const noteStyle = {
      fontFamily: CONFIG.BUBBLE_FONT, fontSize: '22px',
      color: '#e6e9f0', stroke: CONFIG.BUBBLE_STROKE_COLOR, strokeThickness: 4
    };
    const noteY = H * 0.585;

    const before = this.add.text(0, noteY, 'Made with', noteStyle).setOrigin(0, 0.5);
    const after  = this.add.text(0, noteY, 'for Kids',  noteStyle).setOrigin(0, 0.5);
    const heart  = this.add.image(0, noteY, 'heart').setOrigin(0.5);

    // Lay the three pieces out as one centred row, measuring the text
    // rather than guessing at where it ends.
    const gap = 9;
    const heartW = heart.width;
    const rowW = before.width + gap + heartW + gap + after.width;

    let x = W / 2 - rowW / 2;
    before.x = x;                    x += before.width + gap;
    heart.x  = x + heartW / 2;       x += heartW + gap;
    after.x  = x;

    // --- Play button ------------------------------------------------
    // Deliberately the largest thing on the screen. The four options below
    // it are grown-up concerns; this is the only one a five-year-old wants,
    // so it should be impossible to miss.
    const btnY = H * 0.70;
    const btn = this.add.rectangle(W / 2, btnY, 240, 78, 0x4caf50)
      .setStrokeStyle(5, 0xffffff, 0.95)
      .setInteractive({ useHandCursor: true });

    const btnLabel = this.add.text(W / 2, btnY, 'PLAY', {
      ...titleStyle, fontSize: '38px'
    }).setOrigin(0.5);

    this.tweens.add({
      targets: [btn, btnLabel], scaleX: 1.05, scaleY: 1.05,
      duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    btn.on('pointerdown', () => {
      this.tweens.killTweensOf([btn, btnLabel]);
      this.scene.start('CarScene');
    });

    // --- The four grown-up options ----------------------------------
    // Small, but in the game's own bubble colours so the row still reads as
    // part of the same world rather than as a settings bar bolted on.
    const optY = H * 0.83;

    const options = [
      ['ℹ️',  'How to Play', 0x4fc3f7, () => this.showHowToPlay()],
      ['🔒', 'Privacy',     0xab7df6, () => this.showPrivacy()],
      ['⭐', 'Rate Us',     0xffd54f, () => this.rateUs()]
    ];

    // Centred from the count rather than from a hardcoded offset, so adding
    // or removing an option later cannot leave the row sitting off-centre.
    const spacing = 108;
    const startX = W / 2 - spacing * (options.length - 1) / 2;

    options.forEach(([icon, label, colour, onTap], i) => {
      const x = startX + spacing * i;

      const disc = this.add.circle(x, optY, 34, colour)
        .setStrokeStyle(4, 0xffffff, 0.95)
        .setInteractive({ useHandCursor: true });

      this.add.text(x, optY, icon, { fontSize: '30px' }).setOrigin(0.5);

      this.add.text(x, optY + 50, label, {
        fontFamily: CONFIG.BUBBLE_FONT, fontSize: '13px', fontStyle: 'bold',
        color: '#ffffff', stroke: CONFIG.BUBBLE_STROKE_COLOR, strokeThickness: 4
      }).setOrigin(0.5);

      // A quick squeeze on tap, so a press that opens nothing visible - Rate
      // Us today - still feels like it registered.
      disc.on('pointerdown', () => {
        this.tweens.killTweensOf(disc);
        disc.setScale(1);
        this.tweens.add({ targets: disc, scale: 1.18, duration: 90, yoyo: true });
        onTap();
      });
    });

    // --- Music --------------------------------------------------------
    // Any tap here will do. It cannot start before one: browsers refuse
    // audio until the user has interacted, which is why the app is silent
    // for the moment between opening the link and the first touch.
    // Arm the audio unlock NOW, before any touch has happened.
    //
    // This was the flaw in the previous attempt. init() is what installs the
    // document-level unlock listener, but init() was only ever reached from
    // inside start(), which was itself called from a pointerdown handler. So
    // the listener that exists to catch the FIRST touch was being armed one
    // touch too late, and could only ever catch the second.
    GameMusic.init(this);

    // Belt and braces. Phaser's own pointer event tries as well, and start()
    // is safe to call as often as you like.
    this.input.once('pointerdown', () => GameMusic.start(this));

    // The menu needs its own mute. The one in the game is no use to a parent
    // standing on this screen with the groove already playing.
    const speaker = this.add.text(W - 18, 18, GameMusic.muted ? '🔇' : '🔊', {
      fontFamily: 'Arial, Helvetica, sans-serif', fontSize: '30px'
    }).setOrigin(1, 0).setDepth(12);

    speaker.setInteractive(
      new Phaser.Geom.Rectangle(-22, -12, speaker.width + 44, speaker.height + 24),
      Phaser.Geom.Rectangle.Contains
    );

    speaker.on('pointerdown', () => {
      GameMusic.setMuted(!GameMusic.muted);
      speaker.setText(GameMusic.muted ? '🔇' : '🔊');
    });

    // --- Best score so far, if there is one -------------------------
    const best = loadHighScores()[0];
    if (best) {
      this.add.text(W / 2, H * 0.955, 'Best: ' + best.name + '  ' + best.score, {
        fontFamily: CONFIG.BUBBLE_FONT, fontSize: '22px',
        color: '#9aa4b8', stroke: CONFIG.BUBBLE_STROKE_COLOR, strokeThickness: 4
      }).setOrigin(0.5);
    }
  }

  /* -------------------------------------------------------------------
     A read-and-dismiss overlay.

     Deliberately an overlay rather than another Scene: these are things you
     glance at once and close, not places you navigate to, and a Scene would
     mean losing and rebuilding the home screen behind it.
     ---------------------------------------------------------------- */
  showPanel(title, paragraphs) {
    if (this.panel) return;   // one at a time

    const W = this.scale.width;
    const H = this.scale.height;

    this.panel = this.add.container(0, 0).setDepth(50);

    // The dim layer is interactive on purpose: it swallows taps meant for
    // the buttons underneath, so nothing can be pressed by accident through
    // an open panel.
    const dim = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.75).setInteractive();

    // The card is deliberately generous. Privacy grew to five paragraphs
    // when the Google Play and adverts lines went in, and on a short screen
    // the old proportions squeezed it down to 13px with a single pixel to
    // spare. It never overflowed - the fitting loop saw to that - but 13px
    // is not a size to ask a parent to read a privacy notice at.
    const card = this.add.rectangle(W / 2, H * 0.50, W * 0.88, H * 0.78, 0x101a2e, 0.98)
      .setStrokeStyle(5, 0xffd54f, 0.95);

    const heading = this.add.text(W / 2, H * 0.15, title, {
      fontFamily: CONFIG.BUBBLE_FONT, fontSize: '30px', fontStyle: 'bold',
      color: '#ffd54f', stroke: CONFIG.BUBBLE_STROKE_COLOR, strokeThickness: 6
    }).setOrigin(0.5);

    const closeY = H * 0.83;

    // Fit the text to the space rather than trusting a fixed size. The first
    // attempt used 17px everywhere and the copy ran straight down through the
    // Close button - and it would have been worse on a short screen, where
    // there is a fifth less room. Stepping the size down until it measures
    // as fitting is the same trick the word bubbles use.
    const bodyTop  = H * 0.20;
    const bodyMaxH = (closeY - 34) - bodyTop;   // stop short of the button

    const body = this.add.text(W * 0.12, bodyTop, paragraphs.join('\n\n'), {
      fontFamily: CONFIG.BUBBLE_FONT, fontSize: '18px',
      color: '#e6e9f0', lineSpacing: 5,
      wordWrap: { width: W * 0.76 }
    }).setOrigin(0, 0);

    let size = 18;
    while (size > 11 && body.height > bodyMaxH) {
      size -= 1;
      body.setFontSize(size);
    }

    const close = this.add.rectangle(W / 2, closeY, 170, 58, 0x4caf50)
      .setStrokeStyle(4, 0xffffff, 0.95)
      .setInteractive({ useHandCursor: true });

    const closeLabel = this.add.text(W / 2, closeY, 'Close', {
      fontFamily: CONFIG.BUBBLE_FONT, fontSize: '26px', fontStyle: 'bold',
      color: '#ffffff', stroke: CONFIG.BUBBLE_STROKE_COLOR, strokeThickness: 5
    }).setOrigin(0.5);

    close.on('pointerdown', () => {
      this.panel.destroy();
      this.panel = null;
    });

    this.panel.add([dim, card, heading, body, close, closeLabel]);
  }

  showHowToPlay() {
    this.showPanel('How to Play', [
      'Drag anywhere on the screen to steer the car.',
      'Catch the bubbles with kind words in them. Some are worth +3 or +5.',
      'Dodge the grey spiky ones. Hitting one costs a point.',
      'Tap 1, 2 or 3 on the left to drive faster. Faster leaves less time to read, so it is a real choice.',
      'A run is 100 bubbles, then you can put your name on the board.'
    ]);
  }

  showPrivacy() {
    this.showPanel('Privacy', [
      // Scoped to "the game itself" on purpose. Once adverts are added, a
      // blanket "this app collects nothing" would be untrue, but this stays
      // accurate: what the game does and what a third party does are
      // genuinely different things, and the lines below say so plainly.
      'The game itself collects nothing. No sign-in, no account, and no tracking of its own.',
      'Best scores are saved on this device only. Nobody else can see them, and clearing the app\'s data erases them.',
      'This app is distributed through Google Play. Google may collect information about installs and crashes under its own privacy policy, separately from the game.',
      // Ends here on purpose. There was a line about the game engine being
      // fetched from a public code library when run in a browser, but anyone
      // reading this panel is inside the installed app, where the engine is
      // bundled - so it described a situation the reader is not in, and
      // diluted the two disclosures that actually matter. That fact belongs
      // in the hosted web policy, where the reader really is in a browser.
      'Any adverts shown are provided by Google, which may collect information through them under its own privacy policy, independently of the game.'
    ]);
  }

  rateUs() {
    if (CONFIG.PLAY_STORE_URL) {
      window.open(CONFIG.PLAY_STORE_URL, '_blank');
    } else {
      this.toast('Coming soon!');
    }
  }

  toast(message) {
    const W = this.scale.width;
    const H = this.scale.height;

    const t = this.add.text(W / 2, H * 0.90, message, {
      fontFamily: CONFIG.BUBBLE_FONT, fontSize: '20px', fontStyle: 'bold',
      color: '#ffffff', stroke: CONFIG.BUBBLE_STROKE_COLOR, strokeThickness: 5
    }).setOrigin(0.5).setDepth(60);

    this.tweens.add({
      targets: t, alpha: 0, delay: 1300, duration: 500,
      onComplete: () => t.destroy()
    });
  }

  buildHeartTexture() {
    if (this.textures.exists('heart')) return;

    const g = this.make.graphics({ add: false });
    g.fillStyle(0xff5a72, 1);
    g.fillCircle(9, 10, 9);        // left lobe
    g.fillCircle(23, 10, 9);       // right lobe
    g.fillTriangle(1, 13, 31, 13, 16, 31);   // the point below them
    g.generateTexture('heart', 32, 32);
    g.destroy();
  }
}


/* ---------------------------------------------------------------------
   6. BOOT THE GAME
   ------------------------------------------------------------------ */

/* Match the canvas to the shape of the screen it's running on.

   Phones are all sorts of shapes now - a 16:9 handset and a 20:9 one differ
   by about a fifth of the display. With a fixed 450x800 canvas, Scale.FIT
   copes by letterboxing, which is unremarkable in a browser tab but reads as
   unfinished when the game is a full-screen app.

   So the width stays fixed and the height follows the device. The canvas
   then already matches the display, FIT has nothing left to trim, and the
   game fills the screen edge to edge. Everything positioned as a fraction of
   the height moves with it; everything anchored to an edge stays where it is.
*/
function pickGameHeight(width) {
  const vw = window.innerWidth  || width;
  const vh = window.innerHeight || CONFIG.GAME_HEIGHT;

  return Phaser.Math.Clamp(
    Math.round(width * (vh / vw)),
    CONFIG.MIN_GAME_HEIGHT,
    CONFIG.MAX_GAME_HEIGHT
  );
}

CONFIG.GAME_HEIGHT = pickGameHeight(CONFIG.GAME_WIDTH);

const game = new Phaser.Game({
  type: Phaser.AUTO,          // WebGL if the device supports it, else Canvas
  parent: 'game',             // draw into the <div id="game">
  backgroundColor: '#35383f',

  scale: {
    // FIT: keep our 450x800 portrait shape and scale it to fill as much of
    // the screen as possible, letterboxing the leftover space.
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width:  CONFIG.GAME_WIDTH,
    height: CONFIG.GAME_HEIGHT   // set just above, from the real screen shape
  },

  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 0 },   // nothing falls on its own; we set speeds by hand
      debug: false         // flip to true to see collision boxes
    }
  },

  input: {
    activePointer: true,
    touch: { capture: true }   // stop the browser stealing the touch events
  },

  // Lets the name box be a real <input> laid over the canvas, so typing a
  // name brings up the phone's own keyboard. Phaser keeps it positioned in
  // game coordinates however the canvas is scaled.
  // No DOM container. The name is typed on letter keys drawn inside the
  // game, so there is no HTML element over the canvas any more - which is
  // what was fighting the layout every time the phone's keyboard opened.

  // HomeScene is listed first, so it is what the app opens on. Everything
  // else lives on that one screen as overlays, so there is no menu scene.
  scene: [HomeScene, CarScene]
});

// Handy when you're tinkering: open the browser console and you can reach
// the live game, e.g.  game.scene.keys.CarScene.score
window.game = game;

// Hardware back button and the screen wake lock. No-ops in a browser.
Native.init(game);
</script>
