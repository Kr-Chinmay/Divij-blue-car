<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Divij's Blue Car</title>

  <!--
    viewport-fit + user-scalable=no: stops the browser pinch-zooming or
    double-tap-zooming while a small person is frantically dragging the car.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#2b2f3a" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #2b2f3a;

      /* Kill the browser's own touch gestures so drags belong to the game:
         - touch-action: none      -> no scrolling / pinching inside the canvas
         - overscroll-behavior     -> no "pull down to refresh" on Android
         - tap-highlight           -> no grey flash box on tap (iOS) */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Centre the game canvas in whatever space the phone gives us. */
    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <!-- Phaser 3 straight from a CDN. No build step, no npm, no local files. -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>

<script>
/* =====================================================================
   DIVIJ'S BLUE CAR  -  v3
   ---------------------------------------------------------------------
   Everything you see is drawn in code and baked into textures at start-up.
   There are no .png / .mp3 files anywhere - this really is one single file.

   How it plays:
     - Drag anywhere on the screen. The blue car follows your finger, but
       sits a bit ABOVE it so your finger doesn't cover the car.
     - Big colourful bubbles float down, each with a kind word inside.
     - Drive into a bubble -> it pops with a happy sound, score +1.
     - 200 bubbles in total: all 20 words, ten times each, in random order.
       When they're done you get a "well done" card and can go again.

   Sound is generated in code with the Web Audio API. Tap the speaker in
   the top-right to mute.
   ===================================================================== */


/* ---------------------------------------------------------------------
   1. TUNING KNOBS
   All the numbers worth fiddling with live here, so you can change the
   feel of the game without hunting through the code.
   ------------------------------------------------------------------ */
const CONFIG = {
  // The game's internal "paper size". Phaser draws to this fixed portrait
  // canvas and then scales the whole thing to fit the real screen, so the
  // game looks identical on every phone.
  GAME_WIDTH:  450,
  GAME_HEIGHT: 800,

  // --- Car ---
  // The car artwork is drawn at exactly this size, so its on-screen scale
  // stays at 1. That matters: the collect-bounce tweens the scale, and it
  // can only spring back to "normal" if normal means 1.
  CAR_WIDTH:        64,
  CAR_HEIGHT:       112,
  CAR_COLOR:        0x2f6fed,  // main blue bodywork
  CAR_ROOF_COLOR:   0x4b87f2,  // roof panel, a touch lighter than the body
  CAR_GLASS_COLOR:  0xb9d5ff,  // windscreen + rear hatch glass
  CAR_START_Y_FRAC: 0.82,      // where the car sits before you touch anything

  // How far ABOVE your fingertip the car floats, in pixels.
  // Bigger number = car sits higher = more of it visible above your thumb.
  FINGER_OFFSET_Y: 110,

  // How snappily the car catches up to your finger, per frame.
  // 1.0 = teleports instantly (twitchy). 0.1 = slow and floaty.
  // Nudged up alongside the 1.5x speed increase - with bubbles arriving
  // faster there's less time to intercept one, so the car has to be a
  // little more willing. Drop it back to 0.25 if it feels twitchy.
  CAR_FOLLOW_SPEED: 0.30,

  // The car is not allowed to drive above this line. 0.80 = it lives in the
  // bottom fifth of the screen and the top 80% is off limits.
  //
  // This is a reading-time control, not a cosmetic one. Whatever the gear, a
  // bubble now has to fall most of the way down the screen before it can be
  // caught, so the word is on screen far longer before the moment of
  // decision - and an eager driver can't charge up to meet it early. It
  // roughly doubles the reading time at every gear: the earliest possible
  // catch in gear 1 moves from 1.5s to 2.8s, and in gear 3 from 0.7s to
  // 1.3s. Note gear 3 is still tighter than gear 1 used to be - the gears
  // are meant to cost you something.
  //
  // It also quietly fixes the thumb: with the car pinned this low and still
  // riding FINGER_OFFSET_Y above the touch point, the clamp means the car
  // parks at this line for any normal finger position. The finger roams
  // freely below it and never covers the car.
  CAR_MIN_Y_FRAC: 0.80,

  // --- Bubbles ---
  // One radius for every bubble, chosen so the longest phrase ("Keep Going")
  // fits comfortably inside with a margin all the way round.
  BUBBLE_RADIUS: 84,

  // Only ever this many on screen at once. Few and large beats many and
  // small - each word gets a moment to be read.
  MAX_ACTIVE_BUBBLES: 4,

  // Gap between bubbles, measured in PIXELS TRAVELLED rather than in
  // milliseconds waited.
  //
  // This is the whole reason two words can never drift over each other. A
  // timer only guarantees spacing while the speed is constant: brake halfway
  // through a pause and the bubble ahead covers less ground than the timer
  // assumed, and the next one lands on top of it. Counting distance instead
  // makes the gap correct at any speed, and while braking or accelerating,
  // by construction rather than by arithmetic.
  //
  // The minimum simply has to clear a bubble's 168px width.
  GAP_MIN_PX: 250,
  GAP_MAX_PX: 360,

  BUBBLE_SPEED: 218,   // downward drift at cruise, pixels per second

  // The 20 kind words - the ones to CATCH.
  WORDS: [
    'Kind', 'Share', 'Help', 'Thank you', 'Sorry',
    'Gentle', 'Brave', 'Try Again', 'Patient', 'Calm',
    'Learn', 'Focus', 'Practice', 'Happy', 'Grateful',
    'Believe', 'Faith', 'Honest', 'I can', 'Keep Going'
  ],
  REPEATS_PER_WORD: 4,

  // The 10 things to AVOID. Each one mirrors a kind word above - Snatch
  // against Share, Give Up against Keep Going - so the pairs teach the
  // contrast rather than just adding more words.
  BAD_WORDS: [
    'Shout', 'Get Angry', 'Fight', 'Speak Lies', 'Snatch',
    'Tease', 'Give Up', 'Blame Others', 'Interrupt', 'Complain'
  ],
  BAD_REPEATS_PER_WORD: 2,

  // 20 x 4 good + 10 x 2 bad = 100 bubbles, about two and a half minutes.

  // Bright, cheerful fills, stepped through in order so two neighbours are
  // never the same colour: sky blue, grass green, sunshine yellow, coral,
  // purple, orange, pink.
  BUBBLE_COLOURS: [
    0x4fc3f7, 0x66bb6a, 0xffd54f, 0xff7f6b,
    0xab7df6, 0xffa726, 0xff8ac4
  ],

  // Bad bubbles are storm grey AND spiky - different in colour and in
  // shape, so they read as "avoid" before the word has been read at all.
  // That matters at five, when reacting is quicker than reading, and it
  // still works for a child who is colour-blind.
  BAD_COLOUR:      0x4a4f5e,
  BAD_EDGE_COLOUR: 0x8b95a8,
  BAD_SPIKES:      13,
  BAD_INNER_FRAC:  0.82,   // where the spike valleys sit, as a fraction of R

  // Hitting one costs a point, and the score IS allowed to go below zero.
  BAD_PENALTY: 1,

  // Its collision circle is a little smaller than the spikes look, so a
  // near miss counts as a miss. Being generous about the thing you want
  // the player to dodge is the right way round.
  BAD_HITBOX_FRAC: 0.86,

  // Word styling. Legibility first: white letters, thick dark outline, so
  // the text reads against every one of the bubble colours above.
  BUBBLE_FONT: '"Comic Sans MS", "Chalkboard SE", "Segoe UI", Verdana, sans-serif',
  BUBBLE_FONT_MAX: 34,   // starting size; shrinks only if the word is long
  BUBBLE_FONT_MIN: 17,   // never go below this, however long the word
  BUBBLE_TEXT_COLOR:   '#ffffff',
  BUBBLE_STROKE_COLOR: '#101828',

  // --- Scenery ---
  ROAD_COLOR:       0x35383f,  // tar
  LANE_COLOR:       0xf0e6a8,  // dashed centre line
  EDGE_LINE_COLOR:  0xf2f2f2,  // solid white lines down each side

  // How much of the screen width each grass verge takes (0.13 = 13% a side,
  // leaving 74% of the width as road).
  SIDE_STRIP_FRAC: 0.13,

  // The fields drift between these greens so the view keeps changing.
  FIELD_COLOURS: [0x3f7d3a, 0x4c8f3f, 0x36784b, 0x5a9440, 0x2f6f45],
  FIELD_SHIFT_MS: 9000,   // how often to pick a new field colour
  FIELD_FADE_MS:  4000,   // how long the fade between colours takes

  SCROLL_SPEED:  255,   // how fast the road slides past, pixels per second
  PROP_COUNT:    14,    // roadside props recycled around the two verges
  PROP_GAP_MAX:  260,   // extra random gap when a prop wraps back to the top

  // Which props appear, and how often. Listing a key more than once simply
  // makes it more common - trees and bushes should outnumber the rest.
  PROP_KEYS: [
    'tree', 'tree', 'tree', 'bush', 'bush',
    'flower1', 'flower2', 'flower3', 'fence'
  ],

  // --- Collect effects ---
  BURST_PARTICLES: 10,
  BURST_SPEED_MIN: 90,
  BURST_SPEED_MAX: 190,

  // --- Bubble float ---
  // How far the artwork drifts inside each bubble. Kept small on purpose:
  // it's decoration, and the collision circle doesn't move with it.
  BUBBLE_SWAY_X:  9,
  BUBBLE_BOB_Y:   5,
  BUBBLE_SWAY_MS: 2600,   // time for one full sway cycle

  // --- Car trimmings ---
  CAR_SHADOW_ALPHA: 0.28,
  EXHAUST_MS:       90,   // one puff per this many ms at full throttle

  // --- Gear selector (left edge) ---
  // Three notches rather than a throttle you have to keep holding: gear 1 at
  // the bottom, 3 at the top. The knob LATCHES where you put it, so a thumb
  // is only needed to CHANGE speed, never to maintain it - which is the
  // whole point. Holding a throttle down costs you the very thumb you need
  // for catching bubbles.
  //
  // The labels say 1, 2, 3 but the speeds behind them are gentler than that.
  // A literal 3x leaves about 1.6 seconds to read a word, spot that it's one
  // to dodge, and steer around it - past fun and into frustrating at five.
  GEAR_SPEEDS:  [1, 1.5, 2.1],
  GEAR_COLOURS: [0x2f6fed, 0x4caf50, 0xff8f3f],   // blue, green, orange

  SLIDER_X:        40,
  SLIDER_TOP_FRAC: 0.44,   // where the track starts, as a fraction of height
  SLIDER_BOT_FRAC: 0.90,
  SLIDER_TRACK_W:  32,
  SLIDER_KNOB_R:   26,

  // Touches left of this line belong to the slider, never to steering.
  // Steering then maps the REMAINING width onto the full road: a thumb that
  // can only reach the right of the screen can still park the car on the
  // left kerb. Without this the slider would fence off part of the road.
  SLIDER_ZONE_W: 78,

  SPEED_EASE: 0.09,   // how quickly real speed catches up with a gear change

  // --- Speedometer (bottom-right) ---
  // Deliberately small and see-through so it sits over the right-hand verge
  // rather than the road. The needle reads the same number that drives the
  // engine note, so gauge and sound always agree.
  GAUGE_RADIUS:   40,
  GAUGE_SWEEP:    240,   // degrees of needle travel, centred on straight up
  GAUGE_ALPHA:    0.9,
  GAUGE_CRUISE_KPH: 45,   // what it reads in gear 1
  GAUGE_SWERVE_KPH: 25,   // extra it shows for hard swerving
  GAUGE_MAX_KPH:    120,  // full deflection

  // --- Score display ---
  SCORE_COLOR:     '#ffd23f',   // normal
  SCORE_NEG_COLOR: '#ff6b6b',   // once the score has dropped below zero
  SCORE_FONT_SIZE:    '54px',
  SCORE_BOUNCE_SCALE: 1.55,   // how big the score swells when it goes up
  CAR_BOUNCE_SCALE:   1.18,   // how big the car pops when it collects one

  // --- Sound ---
  // Every sound here is generated in code with the Web Audio API. There are
  // no .mp3 / .wav files to download, which keeps this a genuine single file.
  MASTER_VOLUME: 0.9,    // overall level, 0..1
  POP_VOLUME:    0.32,   // the "pop" when you collect a bubble
  HUM_VOLUME:    0.03,   // soft background road hum. Set to 0 for silence.

  // The engine. Its pitch and volume follow how fast you're dragging the
  // car, so it idles when you're still and revs when you swerve.
  //
  // A note on the pitch: phone speakers reproduce almost nothing below about
  // 300Hz, so a "realistic" 60Hz engine simply vanishes on a handset. What
  // you actually hear is its harmonics, which is why this builds the sound
  // from several layers rather than one low tone.
  ENGINE_VOLUME:   0.09,  // set to 0 to switch the engine off entirely
  ENGINE_BASE_HZ:  75,    // pitch when idling
  ENGINE_REV_HZ:   65,    // how much higher it climbs at full tilt
  ENGINE_MAX_PXPS: 600,   // car speed (px/sec) that counts as full throttle

  // How much combustion "grit" (filtered noise) sits on top of the tone.
  // This is most of what stops it sounding like a synthesiser drone.
  ENGINE_GRIT: 0.34,

  // The chug rate rises with the revs, exactly as a real engine's firing
  // rate does. Holding it fixed is what made the old one sound lifeless.
  ENGINE_CHUG_MIN_HZ: 6,
  ENGINE_CHUG_MAX_HZ: 23,
};


/* ---------------------------------------------------------------------
   2. SOUND
   Instead of loading audio files, we build the sounds from scratch with
   the Web Audio API. An oscillator is just a tone generator; shaping its
   volume over time with a "gain" node is what turns a plain beep into a
   recognisable pop.
   ------------------------------------------------------------------ */
class SoundKit {

  constructor(scene) {
    // Phaser already created a Web Audio context for its own sound system,
    // so we borrow that one. Phones get grumpy if a page makes several.
    this.ctx = (scene.sound && scene.sound.context) ? scene.sound.context : null;

    // Some devices / browsers give us no Web Audio at all. If so, every
    // method below quietly does nothing and the game still plays fine.
    this.enabled = !!this.ctx;
    this.muted = false;
    if (!this.enabled) return;

    // One volume knob that everything else feeds into, so muting is a
    // single change rather than chasing down each sound individually.
    this.master = this.ctx.createGain();
    this.master.gain.value = CONFIG.MASTER_VOLUME;

    // A gentle limiter on the way out. The engine alone is three layers
    // through a resonant filter, and with a pop landing on top the total can
    // momentarily push past full scale - where Web Audio clips hard and you
    // hear crackle. This rounds those peaks off instead.
    const limiter = this.ctx.createDynamicsCompressor();
    limiter.threshold.value = -6;
    limiter.knee.value = 6;
    limiter.ratio.value = 12;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.15;

    this.master.connect(limiter);
    limiter.connect(this.ctx.destination);
  }

  // Browsers refuse to make noise until the user has interacted with the
  // page. Calling this from a tap handler wakes the audio up.
  resume() {
    if (this.enabled && this.ctx.state === 'suspended') this.ctx.resume();
  }

  /* Two seconds of random samples on a loop - the raw material for both the
     road hum and the engine's combustion grit. Far smaller than any audio
     file, and once filtered it never repeats audibly. */
  makeNoiseSource() {
    const ctx = this.ctx;
    const frames = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;
    return src;
  }

  /* The happy coin "pop": two quick notes, the second higher than the
     first. That little upward jump is what makes it sound rewarding
     rather than like an error beep. */
  pop() {
    if (!this.enabled || this.muted) return;

    const ctx = this.ctx;
    const t = ctx.currentTime;
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'triangle';   // softer and rounder than a square wave

    // Nudge the pitch a hair each time so a fast streak of collects
    // doesn't sound like a machine stuck on repeat.
    osc.detune.value = Phaser.Math.FloatBetween(-15, 15);   // in cents

    osc.frequency.setValueAtTime(988,  t);          // B5
    osc.frequency.setValueAtTime(1319, t + 0.055);  // jump up to E6

    // The volume envelope. Ramping up from a whisper instead of starting
    // at full blast is what avoids the "click" you get from a raw tone.
    // (Exponential ramps can never reach exactly 0, hence 0.0001.)
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(CONFIG.POP_VOLUME, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);

    osc.connect(gain);
    gain.connect(this.master);

    osc.start(t);
    osc.stop(t + 0.28);   // tidies itself up; no cleanup needed from us
  }

  /* The "oops" for hitting one of the bad bubbles.

     Deliberately the pop turned upside down: where the pop jumps UP to a
     brighter note, this slides DOWN to a duller one. That falling shape is
     what our ears read as "no" - and it's kept short and soft so it lands
     as a bump rather than as something to be upset by. */
  thud() {
    if (!this.enabled || this.muted) return;

    const ctx = this.ctx;
    const t = ctx.currentTime;
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();

    // A filter takes the buzz off the sawtooth, leaving something closer to
    // a wooden knock than an error beep.
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 900;

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, t);
    osc.frequency.exponentialRampToValueAtTime(120, t + 0.20);   // slide down

    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(CONFIG.POP_VOLUME * 0.85, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.master);

    osc.start(t);
    osc.stop(t + 0.32);
  }

  /* A soft, continuous road hum sitting under everything. It's white noise
     with the harsh top end filtered off, which our ears read as tyres on
     tarmac rather than as static. */
  startRoadHum() {
    if (!this.enabled || CONFIG.HUM_VOLUME <= 0) return;
    if (this.humStarted) return;   // only ever one hum
    this.humStarted = true;

    const ctx = this.ctx;
    const src = this.makeNoiseSource();

    // Lowpass filter: keeps the deep rumble, discards the hissy top.
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 420;
    filter.Q.value = 0.7;

    const gain = ctx.createGain();
    gain.gain.value = CONFIG.HUM_VOLUME;

    // A very slow wobble on the filter (about one cycle every 11 seconds)
    // so the hum breathes gently instead of sitting dead flat.
    const lfo = ctx.createOscillator();
    const lfoDepth = ctx.createGain();
    lfo.frequency.value = 0.09;
    lfoDepth.gain.value = 120;
    lfo.connect(lfoDepth);
    lfoDepth.connect(filter.frequency);

    src.connect(filter);
    filter.connect(gain);
    gain.connect(this.master);

    src.start();
    lfo.start();
  }

  /* The engine.

     A real engine is a buzzy tone with most of its harmonics rolled off, so
     two sawtooth oscillators through a lowpass filter get surprisingly
     close. Detuning one of them a few cents against the other is what stops
     it sounding like a flat electronic drone - the two drift in and out of
     phase and the result breathes. */
  startEngine() {
    if (!this.enabled || CONFIG.ENGINE_VOLUME <= 0) return;
    if (this.engineStarted) return;   // only ever one engine
    this.engineStarted = true;

    const ctx = this.ctx;

    // Everything the engine makes is summed here before being filtered.
    const mix = ctx.createGain();

    // --- Layer 1: the fundamental, twice, slightly detuned ------------
    // The detune is what stops it sounding like a flat electronic drone -
    // the two drift in and out of phase and the result breathes.
    this.engineOsc1 = ctx.createOscillator();
    this.engineOsc2 = ctx.createOscillator();
    this.engineOsc1.type = 'sawtooth';
    this.engineOsc2.type = 'sawtooth';
    this.engineOsc2.detune.value = 9;   // cents

    const fundGain = ctx.createGain();
    fundGain.gain.value = 0.55;
    this.engineOsc1.connect(fundGain);
    this.engineOsc2.connect(fundGain);
    fundGain.connect(mix);

    // --- Layer 2: an octave up ----------------------------------------
    // This is the layer that actually survives a phone speaker. The
    // fundamental sits too low to be reproduced on a handset, so without
    // something an octave above it the engine all but disappears.
    this.engineOsc3 = ctx.createOscillator();
    this.engineOsc3.type = 'square';
    const octGain = ctx.createGain();
    octGain.gain.value = 0.22;
    this.engineOsc3.connect(octGain);
    octGain.connect(mix);

    // --- Layer 3: combustion grit -------------------------------------
    // A band of noise, pulsed by the same chug as everything else. This is
    // most of what separates "engine" from "synthesiser holding a note".
    const grit = this.makeNoiseSource();
    const gritBand = ctx.createBiquadFilter();
    gritBand.type = 'bandpass';
    gritBand.frequency.value = 760;
    gritBand.Q.value = 0.8;

    this.engineGrit = ctx.createGain();
    this.engineGrit.gain.value = CONFIG.ENGINE_GRIT;

    grit.connect(gritBand);
    gritBand.connect(this.engineGrit);
    this.engineGrit.connect(mix);

    // --- Shaping ------------------------------------------------------
    // A resonant lowpass that opens as the revs climb, so the engine gets
    // brighter and harder as well as higher.
    this.engineFilter = ctx.createBiquadFilter();
    this.engineFilter.type = 'lowpass';
    this.engineFilter.Q.value = 2.2;   // a little peak here reads as growl

    this.engineGain = ctx.createGain();

    // The chug: a fast wobble on the volume. Its RATE climbs with the revs
    // exactly as a real engine's firing rate does - holding it fixed is what
    // made the old version sound lifeless. Triangle rather than sine gives
    // a firmer pulse without the click a sawtooth would produce.
    this.engineChug = ctx.createOscillator();
    this.engineChug.type = 'triangle';
    const chugDepth = ctx.createGain();
    chugDepth.gain.value = CONFIG.ENGINE_VOLUME * 0.45;
    this.engineChug.connect(chugDepth);
    chugDepth.connect(this.engineGain.gain);   // adds to the gain set below

    // A slow, gentle wander on the pitch so it never sits perfectly still.
    const wobble = ctx.createOscillator();
    const wobbleDepth = ctx.createGain();
    wobble.frequency.value = 0.7;
    wobbleDepth.gain.value = 7;                // cents
    wobble.connect(wobbleDepth);
    wobbleDepth.connect(this.engineOsc1.detune);

    mix.connect(this.engineFilter);
    this.engineFilter.connect(this.engineGain);
    this.engineGain.connect(this.master);

    this.setEngineLoad(0);   // start it idling

    this.engineOsc1.start();
    this.engineOsc2.start();
    this.engineOsc3.start();
    this.engineChug.start();
    wobble.start();
    grit.start();
  }

  /* How hard the car is being driven: 0 = sitting still, 1 = full tilt.

     This is called every frame, so it writes the parameters directly rather
     than scheduling ramps - scheduling sixty automation events a second
     would pile up in the audio timeline and eventually stutter. */
  setEngineLoad(load) {
    if (!this.enabled || !this.engineStarted) return;

    const l = Phaser.Math.Clamp(load, 0, 1);

    const hz = CONFIG.ENGINE_BASE_HZ + l * CONFIG.ENGINE_REV_HZ;
    this.engineOsc1.frequency.value = hz;
    this.engineOsc2.frequency.value = hz;
    this.engineOsc3.frequency.value = hz * 2;   // the octave-up layer

    // The firing rate climbs with the revs, which is what makes accelerating
    // sound like accelerating rather than just like a rising note.
    this.engineChug.frequency.value = CONFIG.ENGINE_CHUG_MIN_HZ
      + l * (CONFIG.ENGINE_CHUG_MAX_HZ - CONFIG.ENGINE_CHUG_MIN_HZ);

    // Open the filter up as it revs, so it gets brighter as well as higher.
    this.engineFilter.frequency.value = 500 + l * 1400;

    // Lean on the grit under load - an engine working hard is rougher.
    this.engineGrit.gain.value = CONFIG.ENGINE_GRIT * (0.8 + 0.6 * l);

    // ...and a little louder overall. The floor here has to stay above the
    // chug's depth, or the wobble would swing the gain negative and the
    // engine would audibly tear.
    this.engineGain.gain.value = CONFIG.ENGINE_VOLUME * (0.75 + 0.5 * l);
  }

  // Fade to silence rather than cutting instantly - an abrupt jump to zero
  // produces an audible click.
  setMuted(muted) {
    this.muted = muted;
    if (!this.enabled) return;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(this.master.gain.value, t);
    this.master.gain.linearRampToValueAtTime(muted ? 0 : CONFIG.MASTER_VOLUME, t + 0.12);
  }
}


/* ---------------------------------------------------------------------
   3. THE GAME SCENE
   A Phaser "Scene" is one screen of a game. We only need one.
   Phaser calls create() once at the start, then update() every frame.
   ------------------------------------------------------------------ */
class CarScene extends Phaser.Scene {

  constructor() {
    super('CarScene');
  }


  /* -------------------------------------------------------------------
     ARTWORK
     The car and every roadside prop are drawn once with the Graphics object
     and then "baked" into a texture. After that they're ordinary images,
     which is far cheaper to draw than re-running the shape commands on
     every single frame.
     ---------------------------------------------------------------- */
  buildCarTexture() {
    const w = CONFIG.CAR_WIDTH;
    const h = CONFIG.CAR_HEIGHT;

    // make.graphics (rather than add.graphics) keeps this off the screen -
    // it's a scratch pad, not something the player should ever see.
    const g = this.make.graphics({ add: false });

    // Wheels first, so the bodywork sits on top of them and only the
    // outer edge of each tyre peeks out. Viewed from above, that's all
    // you'd actually see of a wheel.
    g.fillStyle(0x14161d, 1);
    g.fillRoundedRect(0,     h * 0.16, 9, h * 0.19, 3);
    g.fillRoundedRect(w - 9, h * 0.16, 9, h * 0.19, 3);
    g.fillRoundedRect(0,     h * 0.66, 9, h * 0.19, 3);
    g.fillRoundedRect(w - 9, h * 0.66, 9, h * 0.19, 3);

    // Wing mirrors, poking out just ahead of the windscreen.
    g.fillStyle(0x1d4fb5, 1);
    g.fillRoundedRect(1,     h * 0.28, 8, 7, 3);
    g.fillRoundedRect(w - 9, h * 0.28, 8, 7, 3);

    // The body. A hatchback's defining feature from above is the tail: it
    // stops abruptly instead of tapering into a boot, so the rear corners
    // get a much tighter radius than the rounded nose.
    const bx = 5, by = 2, bw = w - 10, bh = h - 4;
    const bodyRadius = { tl: 17, tr: 17, bl: 8, br: 8 };

    g.fillStyle(CONFIG.CAR_COLOR, 1);
    g.fillRoundedRect(bx, by, bw, bh, bodyRadius);
    g.lineStyle(3, 0x0e1f45, 1);
    g.strokeRoundedRect(bx, by, bw, bh, bodyRadius);

    // Roof panel, sitting between the two windows.
    g.fillStyle(CONFIG.CAR_ROOF_COLOR, 1);
    g.fillRoundedRect(bx + 5, by + h * 0.36, bw - 10, h * 0.26, 6);

    // Windscreen at the front, and the big near-vertical hatch glass at
    // the back that gives this shape its name.
    g.fillStyle(CONFIG.CAR_GLASS_COLOR, 1);
    g.fillRoundedRect(bx + 6, by + h * 0.19, bw - 12, h * 0.15, 6);
    g.fillRoundedRect(bx + 6, by + h * 0.64, bw - 12, h * 0.17, 6);

    // ROOF RAILS: two dark bars running front-to-back along the roof edges.
    g.fillStyle(0x20262f, 1);
    g.fillRoundedRect(bx + 3,      by + h * 0.34, 5, h * 0.30, 2.5);
    g.fillRoundedRect(bx + bw - 8, by + h * 0.34, 5, h * 0.30, 2.5);

    // Headlights at the front...
    g.fillStyle(0xfff3c4, 1);
    g.fillRoundedRect(bx + 5,       by + 3, 14, 7, 3);
    g.fillRoundedRect(bx + bw - 19, by + 3, 14, 7, 3);

    // ...and tail lights at the back.
    g.fillStyle(0xe8402f, 1);
    g.fillRoundedRect(bx + 5,       by + bh - 9, 14, 6, 3);
    g.fillRoundedRect(bx + bw - 19, by + bh - 9, 14, 6, 3);

    g.generateTexture('car', w, h);
    g.destroy();
  }

  /* Every roadside prop, baked into its own small texture. They all get
     drawn the same way: a scratch Graphics object, some shapes, then
     generateTexture under a name we can hand to add.image() later. */
  buildPropTextures() {
    let g = this.make.graphics({ add: false });

    // --- Tree: trunk plus a leafy blob ---
    g.fillStyle(0x6b4a2b, 1);
    g.fillRect(15, 26, 6, 14);
    g.fillStyle(0x2f6b34, 1);
    g.fillCircle(18, 20, 13);
    g.fillCircle(10, 25, 9);
    g.fillCircle(26, 25, 9);
    g.fillStyle(0x3f8b44, 1);   // lighter on top, as if catching the sun
    g.fillCircle(15, 16, 8);
    g.generateTexture('tree', 36, 42);

    // --- Bush: the same idea, lower and wider, no trunk ---
    g.clear();
    g.fillStyle(0x2b6b3c, 1);
    g.fillCircle(9, 18, 8);
    g.fillCircle(21, 18, 8);
    g.fillCircle(15, 13, 10);
    g.fillStyle(0x3c8a4c, 1);
    g.fillCircle(12, 11, 6);
    g.generateTexture('bush', 30, 26);

    // --- Flowers: one texture per colour ---
    // Three separate textures rather than one tinted image, so the yellow
    // middle stays yellow whatever colour the petals are.
    const petals = [
      ['flower1', 0xff8ac4],   // pink
      ['flower2', 0xffffff],   // white
      ['flower3', 0xc79bf5]    // lilac
    ];
    for (const [key, colour] of petals) {
      g.clear();
      g.fillStyle(0x3c7a3f, 1);          // stem
      g.fillRect(8, 12, 2, 10);
      g.fillStyle(colour, 1);            // four petals round a middle
      g.fillCircle(9, 5, 4);
      g.fillCircle(4, 9, 4);
      g.fillCircle(14, 9, 4);
      g.fillCircle(9, 13, 4);
      g.fillStyle(0xffd54f, 1);          // yellow middle
      g.fillCircle(9, 9, 3);
      g.generateTexture(key, 18, 22);
    }

    // --- Gauge face: dial, rim and tick marks ---
    // Only the face is baked in here. The needle has to move, so it stays a
    // separate object that we rotate every frame.
    g.clear();
    const R = CONFIG.GAUGE_RADIUS;

    g.fillStyle(0x101828, 0.82);
    g.fillCircle(R, R, R);
    g.lineStyle(3, 0xffd54f, 0.9);
    g.strokeCircle(R, R, R - 2);

    // Nine ticks spread across the needle's travel, every other one longer.
    // Angles are measured from straight up and go clockwise, matching how
    // Phaser rotates the needle, so the two can't drift out of agreement.
    const half = CONFIG.GAUGE_SWEEP / 2;
    for (let i = 0; i <= 8; i++) {
      const rad = Phaser.Math.DegToRad(-half + (i / 8) * CONFIG.GAUGE_SWEEP);
      const sin = Math.sin(rad), cos = Math.cos(rad);
      const major = (i % 2 === 0);

      const inner = R * (major ? 0.64 : 0.73);
      const outer = R * 0.87;

      g.lineStyle(major ? 3 : 2, major ? 0xffffff : 0x9aa4b8, 0.9);
      g.beginPath();
      g.moveTo(R + inner * sin, R - inner * cos);
      g.lineTo(R + outer * sin, R - outer * cos);
      g.strokePath();
    }

    g.generateTexture('gauge', R * 2, R * 2);

    // --- Fence: a post with two rails, so a run of them reads as fencing ---
    g.clear();
    g.fillStyle(0x8a6a44, 1);
    g.fillRect(6, 2, 4, 24);     // post
    g.fillRect(0, 8, 16, 3);     // upper rail
    g.fillRect(0, 17, 16, 3);    // lower rail
    g.generateTexture('fence', 16, 26);

    g.destroy();
  }


  create() {
    const W = this.scale.width;   // 450
    const H = this.scale.height;  // 800

    this.buildCarTexture();
    this.buildPropTextures();

    this.score = 0;
    this.finished = false;

    // Where the tar starts and stops. Worked out once and reused by the
    // scenery, the car's steering limits and the bubble spawner.
    this.roadLeft  = W * CONFIG.SIDE_STRIP_FRAC;
    this.roadRight = W * (1 - CONFIG.SIDE_STRIP_FRAC);

    // --- Scenery: grass verges, tar, lines, roadside props ----------
    // Purely decorative. Nothing here takes part in the game logic.
    this.currentFieldColour = Phaser.Utils.Array.GetRandom(CONFIG.FIELD_COLOURS);

    this.fieldLeft = this.add.rectangle(
      this.roadLeft / 2, H / 2, this.roadLeft, H, this.currentFieldColour);
    this.fieldRight = this.add.rectangle(
      (W + this.roadRight) / 2, H / 2, W - this.roadRight, H, this.currentFieldColour);

    // The tar itself.
    this.add.rectangle(W / 2, H / 2, this.roadRight - this.roadLeft, H, CONFIG.ROAD_COLOR);

    // Solid white lines down both edges of the road.
    this.add.rectangle(this.roadLeft + 3,  H / 2, 4, H, CONFIG.EDGE_LINE_COLOR, 0.75);
    this.add.rectangle(this.roadRight - 3, H / 2, 4, H, CONFIG.EDGE_LINE_COLOR, 0.75);

    // Dashed centre line. We store the dashes so update() can scroll them.
    this.laneDashes = [];
    for (let y = -40; y < H + 40; y += 90) {
      this.laneDashes.push(this.add.rectangle(W / 2, y, 7, 46, CONFIG.LANE_COLOR));
    }

    // Trees, bushes, flowers and fencing scattered along the verges, spread
    // over roughly two screens' worth of road so they arrive at irregular
    // intervals rather than in a steady procession.
    this.props = [];
    for (let i = 0; i < CONFIG.PROP_COUNT; i++) {
      const prop = this.add.image(0, 0, 'tree');
      this.placeProp(prop, Phaser.Math.Between(-H, H));
      this.props.push(prop);
    }

    // Drift the fields between greens so the scenery keeps changing.
    this.time.addEvent({
      delay: CONFIG.FIELD_SHIFT_MS,
      callback: this.shiftFieldColour,
      callbackScope: this,
      loop: true
    });

    // --- The car ----------------------------------------------------
    // A soft shadow on the tar, sitting below the bubbles so a bubble the
    // car is driving over isn't darkened by it.
    this.carShadow = this.add.ellipse(
      0, 0,
      CONFIG.CAR_WIDTH * 1.05, CONFIG.CAR_HEIGHT * 0.9,
      0x000000, CONFIG.CAR_SHADOW_ALPHA
    ).setDepth(4);

    this.car = this.add.image(W / 2, H * CONFIG.CAR_START_Y_FRAC, 'car');
    this.car.setDepth(6);

    // Counts down to the next exhaust puff (see update()).
    this.exhaustTimer = CONFIG.EXHAUST_MS;

    // Give the car a physics body so Phaser can do the overlap test for us.
    this.physics.add.existing(this.car);
    this.car.body.setAllowGravity(false);
    this.car.body.setImmovable(true);   // bubbles never push the car around

    // Trim the collision box in a little from the artwork. A slightly
    // forgiving box feels better than a pixel-exact one for small hands.
    this.car.body.setSize(CONFIG.CAR_WIDTH - 10, CONFIG.CAR_HEIGHT - 12, true);

    // --- The bubbles ------------------------------------------------
    // A physics group is just a bucket that holds all the live bubbles.
    this.bubbles = this.physics.add.group();

    // Whenever the car overlaps a bubble, call collectBubble().
    // (overlap = "touching" but with no bouncing or blocking.)
    this.physics.add.overlap(this.car, this.bubbles, this.collectBubble, null, this);

    this.colourIndex  = Phaser.Math.Between(0, CONFIG.BUBBLE_COLOURS.length - 1);
    this.lastBubbleX  = W / 2;
    this.buildDeck();

    // Spawning is driven by distance travelled, not by a timer - see the
    // note by GAP_MIN_PX. These two track progress towards the next one.
    this.distanceSinceSpawn = 0;
    this.nextGapPx = Phaser.Math.Between(CONFIG.GAP_MIN_PX, CONFIG.GAP_MAX_PX);

    // --- Score display (top-left corner) ----------------------------
    this.scoreText = this.add.text(20, 14, 'Score: 0', {
      fontFamily: 'Arial, Helvetica, sans-serif',
      fontSize: CONFIG.SCORE_FONT_SIZE,
      color: '#ffd23f',
      fontStyle: 'bold'
    });
    this.scoreText.setDepth(10);          // always drawn on top of everything
    this.scoreText.setShadow(0, 3, '#000000', 5);

    // Grow the score from its left edge, vertically centred, so the bounce
    // swells outwards instead of shoving the text down the screen.
    this.scoreText.setOrigin(0, 0.5);
    this.scoreText.y = 14 + this.scoreText.height / 2;

    // A dark chip behind the score. Bubbles pass underneath the HUD, and a
    // bright one sliding behind bare text made both unreadable.
    //
    // Size it from the widest string the score will ever be, measured rather
    // than guessed, so changing the font size doesn't break the fit. Both
    // ends have to be checked now that the score can go negative: the minus
    // sign makes "-20" wider than "80".
    // Catch every good one and none of the bad; then the exact opposite.
    const best  = CONFIG.WORDS.length * CONFIG.REPEATS_PER_WORD;
    const worst = -CONFIG.BAD_WORDS.length * CONFIG.BAD_REPEATS_PER_WORD * CONFIG.BAD_PENALTY;

    this.scoreText.setText('Score: ' + best);
    const wBest = this.scoreText.width;
    this.scoreText.setText('Score: ' + worst);
    const chipW = Math.max(wBest, this.scoreText.width) + 28;
    const chipH = this.scoreText.height + 12;
    this.scoreText.setText('Score: 0');

    this.add.graphics()
      .setDepth(9)                       // above the bubbles, below the text
      .fillStyle(0x101828, 0.55)
      .fillRoundedRect(8, this.scoreText.y - chipH / 2, chipW, chipH, 16);

    // --- Sound, plus a mute button in the top-right corner ----------
    this.sfx = new SoundKit(this);

    this.muteBtn = this.add.text(W - 18, 20, '🔊', {
      fontFamily: 'Arial, Helvetica, sans-serif',
      fontSize: '32px'
    }).setOrigin(1, 0).setDepth(10);

    // Matching chip behind it, for the same reason as the score.
    this.add.graphics()
      .setDepth(9)
      .fillStyle(0x101828, 0.55)
      .fillRoundedRect(W - this.muteBtn.width - 30, 12,
                       this.muteBtn.width + 24, this.muteBtn.height + 14, 14);

    // A generous invisible hit area - small fingers miss small buttons.
    this.muteBtn.setInteractive(
      new Phaser.Geom.Rectangle(-24, -14, this.muteBtn.width + 48, this.muteBtn.height + 28),
      Phaser.Geom.Rectangle.Contains
    );

    this.muteBtn.on('pointerdown', pointer => {
      this.sfx.setMuted(!this.sfx.muted);
      this.muteBtn.setText(this.sfx.muted ? '🔇' : '🔊');

      // Remember that this particular touch belongs to the button, so the
      // car doesn't go lurching up to the corner while we tap it.
      this.buttonGesture = true;
      this.buttonPointerId = pointer.id;
    });

    this.buttonGesture = false;
    this.buttonPointerId = null;
    this.input.on('pointerup', pointer => {
      if (pointer.id === this.buttonPointerId) {
        this.buttonGesture = false;
        this.buttonPointerId = null;
      }
    });

    // --- Throttle slider (left edge) --------------------------------
    // Two fingers have to work at once here - one on the knob, one steering -
    // so Phaser needs to track more than its default single touch point.
    this.input.addPointer(2);

    this.sliderTop = H * CONFIG.SLIDER_TOP_FRAC;
    this.sliderBot = H * CONFIG.SLIDER_BOT_FRAC;
    this.sliderMid = (this.sliderTop + this.sliderBot) / 2;

    const trackH = this.sliderBot - this.sliderTop;
    const halfTrack = CONFIG.SLIDER_TRACK_W / 2;

    this.add.graphics()
      .setDepth(9)
      .fillStyle(0x101828, 0.5)
      .fillRoundedRect(CONFIG.SLIDER_X - halfTrack, this.sliderTop,
                       CONFIG.SLIDER_TRACK_W, trackH, halfTrack);

    // A notch drawn at each gear position, so it reads as three settings to
    // choose between rather than a continuous slide.
    for (let g = 1; g <= CONFIG.GEAR_SPEEDS.length; g++) {
      this.add.rectangle(CONFIG.SLIDER_X, this.gearDetentY(g),
                         CONFIG.SLIDER_TRACK_W - 12, 3, 0xffffff, 0.4).setDepth(10);
    }

    this.add.text(CONFIG.SLIDER_X, this.sliderTop - 48, 'SPEED', {
      fontFamily: 'Arial, Helvetica, sans-serif', fontSize: '15px',
      color: '#cbd3e1', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(10);

    // Arrows rather than words for which way is faster - a five-year-old
    // reads a triangle long before he reads "accelerate". Drawn as shapes
    // so they can't depend on a font having the glyph.
    this.add.triangle(CONFIG.SLIDER_X, this.sliderTop - 26,
                      0, 13, 9, 0, 18, 13, 0x9aa4b8).setDepth(10);
    this.add.triangle(CONFIG.SLIDER_X, this.sliderBot + 26,
                      0, 0, 18, 0, 9, 13, 0x9aa4b8).setDepth(10);

    this.sliderKnob = this.add.circle(CONFIG.SLIDER_X, this.sliderBot,
                                      CONFIG.SLIDER_KNOB_R, CONFIG.GEAR_COLOURS[0])
      .setStrokeStyle(4, 0xffffff, 0.9)
      .setDepth(11);

    // The gear number rides on the knob, so what you've selected is legible
    // without having to work out which notch the knob is sitting at.
    this.gearLabel = this.add.text(CONFIG.SLIDER_X, this.sliderBot, '1', {
      fontFamily: 'Arial, Helvetica, sans-serif', fontSize: '28px',
      color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(12);

    // Which touch point is working the knob, so steering can ignore it.
    // null rather than undefined so "no finger" is unambiguous.
    this.sliderPointerId = null;

    // A tall invisible pad rather than the knob itself as the target: small
    // fingers grab near the knob, not exactly on it.
    const grabPad = this.add.rectangle(
      CONFIG.SLIDER_ZONE_W / 2, this.sliderMid,
      CONFIG.SLIDER_ZONE_W, trackH + 80, 0x000000, 0
    ).setDepth(11).setInteractive();

    // Tapping a notch selects it outright, so any gear is one tap away in
    // either direction - no cycling up through 3 to get back down to 1.
    grabPad.on('pointerdown', pointer => {
      this.sliderPointerId = pointer.id;
      this.setGear(this.gearFromY(pointer.y));
    });

    // Nothing happens on release. The knob stays where it was put - that is
    // the whole difference from the throttle this replaces.
    this.input.on('pointerup', pointer => {
      if (pointer.id === this.sliderPointerId) this.sliderPointerId = null;
    });

    this.setGear(1, false);

    // --- Speedometer (bottom-right) ---------------------------------
    // Tucked into the corner over the right-hand verge, so it covers scenery
    // rather than road. Nothing here is interactive, so touches pass straight
    // through to the car - you can still steer with a finger on the gauge.
    const gx = W - CONFIG.GAUGE_RADIUS - 8;
    const gy = H - CONFIG.GAUGE_RADIUS - 8;

    this.add.image(gx, gy, 'gauge').setDepth(10).setAlpha(CONFIG.GAUGE_ALPHA);

    // Origin at the bottom of the needle so it pivots about the hub rather
    // than spinning around its own middle.
    this.gaugeNeedle = this.add
      .rectangle(gx, gy, 3, CONFIG.GAUGE_RADIUS * 0.76, 0xff5a52)
      .setOrigin(0.5, 1)
      .setDepth(11);

    this.add.circle(gx, gy, 5, 0xffd54f).setDepth(12);   // hub cap

    this.gaugeText = this.add.text(gx, gy + CONFIG.GAUGE_RADIUS * 0.40, '0', {
      fontFamily: 'Arial, Helvetica, sans-serif',
      fontSize: '16px',
      color: '#ffffff',
      fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(12);

    this.add.text(gx, gy + CONFIG.GAUGE_RADIUS * 0.68, 'km/h', {
      fontFamily: 'Arial, Helvetica, sans-serif',
      fontSize: '9px',
      color: '#9aa4b8'
    }).setOrigin(0.5).setDepth(12);

    // Browsers block audio until the player interacts with the page, so the
    // background hum can only start on the first tap - not before.
    this.input.once('pointerdown', () => {
      this.sfx.resume();
      this.sfx.startRoadHum();
      this.sfx.startEngine();
    });

    // How hard the engine is working, smoothed between frames (see update()).
    this.engineLoad = 0;
    this.swerveLoad = 0;

    // How fast the world is running compared with cruise. Starts at 1 so
    // nothing lurches on the first frame before the slider is touched.
    this.speedMul = 1;

    // --- One-time "how to play" hint --------------------------------
    this.hint = this.add.text(W / 2, H * 0.30, 'Drag to drive!', {
      fontFamily: 'Arial, Helvetica, sans-serif',
      fontSize: '30px',
      color: '#ffffff',
      stroke: '#101828',
      strokeThickness: 5
    }).setOrigin(0.5).setDepth(9).setAlpha(0.85);

    // Gently pulse the hint until the first touch, then fade it away.
    this.tweens.add({
      targets: this.hint, alpha: 0.3, duration: 800,
      yoyo: true, repeat: -1
    });
    // Fade the hint away on the first touch - or after 6 seconds if the
    // player is still working out what to do, so it never sits there forever.
    const dismissHint = () => {
      if (!this.hint || !this.hint.scene) return;   // already gone
      this.tweens.killTweensOf(this.hint);
      this.tweens.add({ targets: this.hint, alpha: 0, duration: 400,
                        onComplete: () => this.hint.destroy() });
    };
    this.input.once('pointerdown', dismissHint);
    this.time.delayedCall(6000, dismissHint);

    // Where the car is trying to get to. Starts at its current position so
    // it doesn't lurch anywhere before the first touch.
    this.targetX = this.car.x;
    this.targetY = this.car.y;

    // Has the player touched / moved the pointer even once yet?
    // Before any input, Phaser reports the pointer as sitting at (0, 0),
    // which would yank the car into the corner the instant the game loads.
    // So we ignore the pointer entirely until we've seen a real event.
    this.pointerReady = false;
    this.input.on('pointerdown', () => { this.pointerReady = true; });
    this.input.on('pointermove', () => { this.pointerReady = true; });
  }


  /* -------------------------------------------------------------------
     Build the running order for a full session.

     Stacking ten copies of the word list and shuffling the whole thing
     guarantees every word appears exactly ten times, while the order stays
     unpredictable. Handing out random words instead would mean some words
     turning up constantly and others barely at all.
     ---------------------------------------------------------------- */
  buildDeck() {
    this.deck = [];

    // Each entry carries its own flag rather than us keeping two lists and
    // trying to interleave them - shuffling one mixed deck is what makes the
    // bad ones arrive unpredictably instead of on a rhythm.
    for (let round = 0; round < CONFIG.REPEATS_PER_WORD; round++) {
      for (const word of CONFIG.WORDS) this.deck.push({ word, bad: false });
    }
    for (let round = 0; round < CONFIG.BAD_REPEATS_PER_WORD; round++) {
      for (const word of CONFIG.BAD_WORDS) this.deck.push({ word, bad: true });
    }

    Phaser.Utils.Array.Shuffle(this.deck);

    // Remembered so the finish card can say how many there were without the
    // number being written down in two places.
    this.totalBubbles = this.deck.length;
  }


  /* -------------------------------------------------------------------
     Queue up the next bubble after a random pause.

     This re-schedules itself rather than using one fixed repeating timer,
     which is what lets every gap be a different length.
     ---------------------------------------------------------------- */
  /* -------------------------------------------------------------------
     Gear helpers.

     `this.gear` is the single source of truth - an integer from 1 up. The
     knob's position is only ever a picture of it, never the other way
     round, so a half-finished drag can't leave the two disagreeing.
     ---------------------------------------------------------------- */

  // Gear 1 sits at the BOTTOM of the track, the top gear at the top.
  gearDetentY(gear) {
    const steps = CONFIG.GEAR_SPEEDS.length - 1;
    return Phaser.Math.Linear(this.sliderBot, this.sliderTop, (gear - 1) / steps);
  }

  // Whichever notch the finger landed nearest to.
  gearFromY(y) {
    let best = 1, bestDistance = Infinity;
    for (let g = 1; g <= CONFIG.GEAR_SPEEDS.length; g++) {
      const d = Math.abs(y - this.gearDetentY(g));
      if (d < bestDistance) { bestDistance = d; best = g; }
    }
    return best;
  }

  setGear(gear, animate = true) {
    this.gear = Phaser.Math.Clamp(gear, 1, CONFIG.GEAR_SPEEDS.length);

    const y = this.gearDetentY(this.gear);
    this.sliderKnob.setFillStyle(CONFIG.GEAR_COLOURS[this.gear - 1]);
    this.gearLabel.setText(String(this.gear));

    // Kill any in-flight slide first, or dabbing quickly between gears
    // leaves two tweens fighting over the knob.
    this.tweens.killTweensOf(this.sliderKnob);

    if (animate) {
      this.tweens.add({ targets: this.sliderKnob, y, duration: 170, ease: 'Back.easeOut' });
    } else {
      this.sliderKnob.y = y;
    }
  }

  // Where the whole world's speed should be heading, given the gear.
  targetSpeedMultiplier() {
    return CONFIG.GEAR_SPEEDS[this.gear - 1];
  }


  /* -------------------------------------------------------------------
     Find the touch point that should be steering.

     Anything working the slider is skipped, as is anything inside the
     slider's zone - otherwise grabbing the knob would also fling the car
     across to the left kerb.
     ---------------------------------------------------------------- */
  steeringPointer() {
    const onTouch = this.sys.game.device.input.touch;

    for (const p of this.input.manager.pointers) {
      if (!p) continue;
      if (this.sliderPointerId !== null && p.id === this.sliderPointerId) continue;
      if (this.buttonGesture && p.id === this.buttonPointerId) continue;
      if (p.x <= CONFIG.SLIDER_ZONE_W) continue;

      // A mouse has nothing to hold down, so it steers whenever it moves.
      if (p.isDown || (!onTouch && p.id === 0)) return p;
    }
    return null;
  }


  /* -------------------------------------------------------------------
     Fit a word inside a bubble, shrinking the type only as much as needed.
     ---------------------------------------------------------------- */
  makeBubbleLabel(word, radius) {
    // The largest rectangle we let the text occupy. Both fractions are
    // deliberately well inside the circle: a box of half-width 0.75r and
    // half-height 0.55r has its corners at 0.93r, so even the corners of
    // the text stay clear of the bubble's edge.
    const maxW = radius * 1.50;
    const maxH = radius * 1.10;

    const label = this.add.text(0, 0, word, {
      fontFamily: CONFIG.BUBBLE_FONT,
      fontSize: CONFIG.BUBBLE_FONT_MAX + 'px',
      color: CONFIG.BUBBLE_TEXT_COLOR,
      fontStyle: 'bold',
      align: 'center',
      stroke: CONFIG.BUBBLE_STROKE_COLOR,
      strokeThickness: 8,
      // Two-word phrases wrap onto a second line, which lets them stay
      // much larger than they could as one long single line.
      wordWrap: { width: maxW, useAdvancedWrap: true },
      padding: { x: 6, y: 6 }
    }).setOrigin(0.5);

    // Step the size down until it fits. Phaser re-measures the text every
    // time the style changes, so this is a real measurement each pass
    // rather than an estimate - nothing can spill outside the bubble.
    let size = CONFIG.BUBBLE_FONT_MAX;
    while (size > CONFIG.BUBBLE_FONT_MIN && (label.width > maxW || label.height > maxH)) {
      size -= 1;
      label.setFontSize(size);
      label.setWordWrapWidth(maxW);
      // Keep the outline proportional, so small text doesn't get swallowed
      // by an outline that's suddenly too heavy for it.
      label.setStroke(CONFIG.BUBBLE_STROKE_COLOR, Math.max(4, Math.round(size * 0.23)));
    }

    return label;
  }


  /* -------------------------------------------------------------------
     Create one bubble just above the top edge of the screen.
     ---------------------------------------------------------------- */
  spawnBubble() {
    // Re-check the deck here, not just when the timer was set. A pause timer
    // set while words remained can still be in flight after the last one is
    // handed out, and popping an empty deck would spawn a bubble reading
    // "undefined" - and let the score keep moving after the run had ended.
    if (this.deck.length === 0) return;

    const W = this.scale.width;
    const R = CONFIG.BUBBLE_RADIUS;

    const { word, bad } = this.deck.pop();

    // Good bubbles step through the bright colour list rather than picking at
    // random, so two in a row are never the same. Bad ones are always the one
    // storm grey - they should be instantly recognisable, not varied.
    let colour;
    if (bad) {
      colour = CONFIG.BAD_COLOUR;
    } else {
      colour = CONFIG.BUBBLE_COLOURS[this.colourIndex % CONFIG.BUBBLE_COLOURS.length];
      this.colourIndex++;
    }

    // Keep bubbles over the road and fully on screen. Then try a few times
    // to avoid dropping this one straight down the same column as the last,
    // which would make two big bubbles awkward to catch separately.
    const minX = Math.max(R + 6, this.roadLeft + R * 0.35);
    const maxX = Math.min(W - R - 6, this.roadRight - R * 0.35);

    let x = Phaser.Math.Between(minX, maxX);
    for (let tries = 0; tries < 6 && Math.abs(x - this.lastBubbleX) < R; tries++) {
      x = Phaser.Math.Between(minX, maxX);
    }
    this.lastBubbleX = x;

    // A container groups the circle, the shine and the word together, so
    // they move - and pop - as one object.
    const bubble = this.add.container(x, -R - 10);

    // Good ones are smooth circles with a soft highlight; bad ones are
    // thorny stars with no shine. A Star shape whose inner radius is most of
    // its outer one reads as a spiky circle rather than a cartoon star.
    let ball, shine;

    if (bad) {
      ball = this.add.star(0, 0, CONFIG.BAD_SPIKES, R * CONFIG.BAD_INNER_FRAC, R, colour);
      ball.setStrokeStyle(4, CONFIG.BAD_EDGE_COLOUR, 0.95);
    } else {
      ball = this.add.circle(0, 0, R, colour);
      ball.setStrokeStyle(5, 0xffffff, 0.95);

      // A soft highlight up in the top-left sells the "bubble" look.
      shine = this.add.ellipse(-R * 0.34, -R * 0.40, R * 0.52, R * 0.34, 0xffffff, 0.30);
      shine.setAngle(-25);
    }

    // The artwork goes in a second container nested inside the first. The
    // outer one is what physics drives; the inner one is free to drift about
    // for the floating effect without ever moving the collision circle.
    const inner = this.add.container(0, 0);
    inner.add([ball, this.makeBubbleLabel(word, R)]);
    if (shine) inner.addAt(shine, 1);   // between the ball and the word

    bubble.add(inner);
    bubble.setDepth(5);
    bubble.setData('inner', inner);
    bubble.setData('colour', colour);
    bubble.setData('bad', bad);
    bubble.setData('phase', Phaser.Math.FloatBetween(0, Math.PI * 2));

    // Swell into view rather than simply appearing at the top edge.
    bubble.setScale(0.35);
    this.tweens.add({ targets: bubble, scale: 1, duration: 380, ease: 'Back.easeOut' });

    // Adding it to the physics group gives it a physics body automatically.
    this.bubbles.add(bubble);

    // A round body, centred on the container, so the collision matches the
    // artwork instead of being a square around it. Bad ones get a slightly
    // smaller circle than they look, so a near miss counts as a miss.
    const bodyR = bad ? R * CONFIG.BAD_HITBOX_FRAC : R;
    bubble.body.setCircle(bodyR, -bodyR, -bodyR);
    bubble.body.setAllowGravity(false);

    // One shared speed for every bubble - see the note by GAP_MIN_PX. The
    // update loop re-applies it every frame as the throttle moves, so they
    // always fall in lockstep and the spacing they spawn with is the
    // spacing they keep, all the way down the screen.
    bubble.body.setVelocityY(CONFIG.BUBBLE_SPEED * this.speedMul);
  }


  /* -------------------------------------------------------------------
     Called by Phaser when the car overlaps a bubble.
     ---------------------------------------------------------------- */
  collectBubble(car, bubble) {
    // Guard: overlap can fire twice in one frame for the same bubble,
    // so ignore it if we've already started collecting this one.
    if (bubble.getData('collected')) return;
    bubble.setData('collected', true);

    // The bubble stops moving and stops counting as a target immediately...
    bubble.body.enable = false;
    bubble.body.setVelocity(0, 0);

    // ...and leaves the group straight away, so it stops counting towards
    // the "how many are on screen" limit while its pop plays out.
    this.bubbles.remove(bubble);

    const bad = bubble.getData('bad');

    // Scatter a handful of bits in the bubble's own colour, and float the
    // score change up from where it was hit.
    this.burst(bubble.x, bubble.y, bubble.getData('colour'));
    this.scorePopup(bubble.x, bubble.y, bad);

    // Drop the entrance tween if it's somehow still running, or it would
    // fight the pop below and the bubble would never finish shrinking.
    this.tweens.killTweensOf(bubble);

    // ...then swells and fades before removing itself.
    this.tweens.add({
      targets: bubble,
      scale: 1.7,
      alpha: 0,
      duration: 200,
      ease: 'Quad.easeOut',
      onComplete: () => bubble.destroy()
    });

    if (bad) {
      // A dull thud and a jolt of the camera, so hitting a bad one feels
      // like a bump rather than a reward.
      this.sfx.thud();
      this.cameras.main.shake(200, 0.009);
      this.score -= CONFIG.BAD_PENALTY;   // allowed to go below zero
    } else {
      this.sfx.pop();
      this.score += 1;
    }

    this.scoreText.setText('Score: ' + this.score);

    // Turn the number red once it's in the negative, so a dropping score is
    // obvious at a glance rather than needing the minus sign to be spotted.
    this.scoreText.setColor(this.score < 0 ? CONFIG.SCORE_NEG_COLOR : CONFIG.SCORE_COLOR);

    // Two bits of visual feedback: the number swells, and the car itself
    // gives a quick squeeze - so you feel the pickup even if you're
    // watching the car rather than the corner of the screen.
    this.bounce(this.scoreText, CONFIG.SCORE_BOUNCE_SCALE, 110);
    this.bounce(this.car,       CONFIG.CAR_BOUNCE_SCALE,    80);
  }


  /* -------------------------------------------------------------------
     A spray of little discs in the popped bubble's colour.

     Each one is an ordinary circle on a tween rather than a Phaser particle
     emitter - emitters need a texture, and this stays closer to how the
     rest of the game is drawn. A collect happens at most once a second or
     so, so ten short-lived circles cost nothing.
     ---------------------------------------------------------------- */
  burst(x, y, colour) {
    for (let i = 0; i < CONFIG.BURST_PARTICLES; i++) {
      // Spread them evenly around the circle, then jitter each one a little
      // so the ring doesn't look mechanical.
      const angle = (Math.PI * 2 * i) / CONFIG.BURST_PARTICLES
                  + Phaser.Math.FloatBetween(-0.25, 0.25);
      const dist = Phaser.Math.Between(CONFIG.BURST_SPEED_MIN, CONFIG.BURST_SPEED_MAX);

      const bit = this.add.circle(x, y, Phaser.Math.Between(5, 10), colour).setDepth(7);

      this.tweens.add({
        targets: bit,
        x: x + Math.cos(angle) * dist,
        y: y + Math.sin(angle) * dist,
        scale: 0,
        alpha: 0,
        duration: Phaser.Math.Between(380, 620),
        ease: 'Quad.easeOut',
        onComplete: () => bit.destroy()
      });
    }
  }


  /* -------------------------------------------------------------------
     A "+1" that drifts up from wherever the bubble was caught.
     ---------------------------------------------------------------- */
  scorePopup(x, y, bad) {
    const label = this.add.text(x, y, bad ? '-' + CONFIG.BAD_PENALTY : '+1', {
      fontFamily: CONFIG.BUBBLE_FONT,
      fontSize: '38px',
      fontStyle: 'bold',
      color: bad ? CONFIG.SCORE_NEG_COLOR : '#ffffff',
      stroke: CONFIG.BUBBLE_STROKE_COLOR,
      strokeThickness: 7
    }).setOrigin(0.5).setDepth(11);

    this.tweens.add({
      targets: label,
      y: y - 90,
      alpha: 0,
      duration: 750,
      ease: 'Quad.easeOut',
      onComplete: () => label.destroy()
    });
  }


  /* -------------------------------------------------------------------
     One puff of exhaust from the back of the car.
     ---------------------------------------------------------------- */
  puff() {
    const p = this.add.circle(
      this.car.x + Phaser.Math.Between(-9, 9),
      this.car.y + CONFIG.CAR_HEIGHT * 0.48,
      Phaser.Math.Between(4, 7),
      0xb9c0cc,
      0.45
    ).setDepth(4);

    // Drift back down the road, growing and thinning out as it goes.
    //
    // A puff hangs in the air while the car drives on, so it should slide
    // backwards at exactly road speed. Deriving the distance from
    // SCROLL_SPEED rather than hardcoding it means the smoke keeps pace
    // automatically whenever the game's speed is retuned.
    const life = Phaser.Math.Between(450, 700);

    this.tweens.add({
      targets: p,
      y: p.y + CONFIG.SCROLL_SPEED * this.speedMul * (life / 1000),
      scale: 2.2,
      alpha: 0,
      duration: life,
      ease: 'Quad.easeOut',
      onComplete: () => p.destroy()
    });
  }


  /* -------------------------------------------------------------------
     A quick "pop out and settle back" on any object.

     Killing any tween already running on the target first matters: collect
     two bubbles in quick succession and the second bounce would otherwise
     fight the first, leaving the object stranded at the wrong size.

     Worth knowing: an Arcade physics body DOES scale with its game object,
     so for the ~80ms the car is bouncing its collision box is up to 18%
     bigger. That only ever happens just after a pickup, and a slightly
     generous car is no bad thing here, so we let it be.
     ---------------------------------------------------------------- */
  bounce(target, peakScale, halfDuration) {
    this.tweens.killTweensOf(target);
    target.setScale(1);

    this.tweens.add({
      targets: target,
      scale: peakScale,
      duration: halfDuration,
      yoyo: true,                    // swell up, then shrink back
      ease: 'Back.easeOut',          // slight overshoot = livelier bounce
      onComplete: () => target.setScale(1)   // guarantee we land exactly at 1
    });
  }


  /* -------------------------------------------------------------------
     Drop a roadside prop somewhere on one of the two grass verges.
     ---------------------------------------------------------------- */
  placeProp(prop, y) {
    const W = this.scale.width;

    // Fresh identity each time round: a tree can come back as a bush.
    prop.setTexture(Phaser.Utils.Array.GetRandom(CONFIG.PROP_KEYS));
    prop.setScale(Phaser.Math.FloatBetween(0.8, 1.15));

    // Work the half-width out AFTER scaling, or a big prop hangs over the
    // edge of the verge and onto the tar.
    const half = prop.displayWidth / 2 + 2;
    const onLeft = Math.random() < 0.5;

    prop.x = onLeft
      ? Phaser.Math.Between(half, Math.max(half, this.roadLeft - half))
      : Phaser.Math.Between(Math.min(W - half, this.roadRight + half), W - half);
    prop.y = y;
  }


  /* -------------------------------------------------------------------
     Fade both fields to a new green.
     ---------------------------------------------------------------- */
  shiftFieldColour() {
    const from = this.currentFieldColour;
    const to = Phaser.Utils.Array.GetRandom(
      CONFIG.FIELD_COLOURS.filter(c => c !== from));

    const cFrom = Phaser.Display.Color.IntegerToColor(from);
    const cTo   = Phaser.Display.Color.IntegerToColor(to);

    // addCounter just tweens a plain number for us; we turn that number
    // into a blend of the two colours on every frame.
    this.tweens.addCounter({
      from: 0,
      to: 100,
      duration: CONFIG.FIELD_FADE_MS,
      onUpdate: tween => {
        const step = Phaser.Display.Color.Interpolate.ColorWithColor(
          cFrom, cTo, 100, tween.getValue());
        const colour = Phaser.Display.Color.GetColor(step.r, step.g, step.b);
        this.fieldLeft.setFillStyle(colour);
        this.fieldRight.setFillStyle(colour);
      },
      onComplete: () => { this.currentFieldColour = to; }
    });
  }


  /* -------------------------------------------------------------------
     All 200 bubbles have been and gone.
     ---------------------------------------------------------------- */
  showFinishBanner() {
    const W = this.scale.width;
    const H = this.scale.height;

    this.banner = this.add.container(W / 2, H * 0.40).setDepth(20);

    const panel = this.add.rectangle(0, 0, W * 0.84, 240, 0x101a2e, 0.94);
    panel.setStrokeStyle(5, 0xffd54f, 0.95);

    const bigStyle = {
      fontFamily: CONFIG.BUBBLE_FONT, fontSize: '40px', fontStyle: 'bold',
      color: '#ffffff', stroke: CONFIG.BUBBLE_STROKE_COLOR, strokeThickness: 6,
      align: 'center'
    };

    this.banner.add([
      panel,
      this.add.text(0, -66, 'All ' + this.totalBubbles + ' done!', bigStyle).setOrigin(0.5),
      this.add.text(0, 0, 'Score: ' + this.score, {
        ...bigStyle, fontSize: '52px', color: '#ffd54f'
      }).setOrigin(0.5),
      this.add.text(0, 72, 'Tap to play again', {
        ...bigStyle, fontSize: '26px'
      }).setOrigin(0.5)
    ]);

    // Wait a beat before listening for the tap, so a finger still dragging
    // the car when the card appears doesn't restart it by accident.
    this.time.delayedCall(800, () => {
      this.input.once('pointerdown', () => this.resetRun());
    });
  }


  /* -------------------------------------------------------------------
     Start a fresh run of 200 without reloading the scene - that way the
     sound stays set up exactly as it is (restarting the scene would build
     a second road hum on top of the first).
     ---------------------------------------------------------------- */
  resetRun() {
    if (this.banner) {
      this.banner.destroy();
      this.banner = null;
    }

    this.score = 0;
    this.scoreText.setText('Score: 0');
    this.scoreText.setColor(CONFIG.SCORE_COLOR);   // clear any red from last run
    this.finished = false;

    this.buildDeck();
    this.distanceSinceSpawn = 0;
    this.nextGapPx = Phaser.Math.Between(CONFIG.GAP_MIN_PX, CONFIG.GAP_MAX_PX);

    // Back to gear 1, so a new run always starts at a speed he chose to
    // leave rather than one left over from the last go.
    this.setGear(1);
  }


  /* -------------------------------------------------------------------
     Runs every frame (~60 times a second).
     `delta` is milliseconds since the previous frame.
     ---------------------------------------------------------------- */
  update(time, delta) {
    const H = this.scale.height;

    const W = this.scale.width;

    // --- 0. Gear ----------------------------------------------------
    // A finger already down on the selector can slide between notches, so
    // it works either as three buttons or as a little gear lever.
    if (this.sliderPointerId !== null) {
      const held = this.input.manager.pointers.find(p => p && p.id === this.sliderPointerId);
      if (held && held.isDown) {
        const g = this.gearFromY(held.y);
        if (g !== this.gear) this.setGear(g);
      }
    }

    // Ease towards the gear's speed instead of snapping to it, so changing
    // gear pulls away smoothly rather than jolting the whole screen.
    this.speedMul = Phaser.Math.Linear(
      this.speedMul, this.targetSpeedMultiplier(), CONFIG.SPEED_EASE);

    // The number rides along with the knob while it slides between notches.
    this.gearLabel.y = this.sliderKnob.y;

    const halfW = CONFIG.CAR_WIDTH  / 2;
    const halfH = CONFIG.CAR_HEIGHT / 2;
    const carMinX = this.roadLeft  + halfW;
    const carMaxX = this.roadRight - halfW;

    // --- 1. Work out where the car should be ------------------------
    const pointer = this.steeringPointer();

    if (pointer && this.pointerReady) {
      // Map the touchable width (everything right of the slider) onto the
      // full width of the road. A thumb that can only reach the right of
      // the screen can still put the car on the left kerb.
      const across = Phaser.Math.Clamp(
        (pointer.x - CONFIG.SLIDER_ZONE_W) / (W - CONFIG.SLIDER_ZONE_W), 0, 1);
      this.targetX = Phaser.Math.Linear(carMinX, carMaxX, across);

      // THE KEY BIT: sit FINGER_OFFSET_Y pixels above the touch point,
      // so a fingertip never sits on top of the car.
      this.targetY = pointer.y - CONFIG.FINGER_OFFSET_Y;
    }

    // Keep the car on the tar, and never let it climb too high.
    this.targetX = Phaser.Math.Clamp(this.targetX, carMinX, carMaxX);
    this.targetY = Phaser.Math.Clamp(this.targetY, H * CONFIG.CAR_MIN_Y_FRAC, H - halfH);

    // --- 2. Glide towards that target -------------------------------
    // Linear interpolation: move a fraction of the remaining distance each
    // frame. That gives smooth movement instead of a jittery teleport.
    const prevX = this.car.x;
    const prevY = this.car.y;

    this.car.x = Phaser.Math.Linear(this.car.x, this.targetX, CONFIG.CAR_FOLLOW_SPEED);
    this.car.y = Phaser.Math.Linear(this.car.y, this.targetY, CONFIG.CAR_FOLLOW_SPEED);

    // --- 2b. Let the engine follow how hard you're driving -----------
    // Distance covered this frame, converted to pixels per second. Guarding
    // the divide matters: delta can be 0 on the very first frame, and
    // dividing by it would hand the engine an Infinity.
    const moved = Phaser.Math.Distance.Between(prevX, prevY, this.car.x, this.car.y);
    const pxPerSec = moved / (Math.max(delta, 1) / 1000);

    // Smooth towards the new value rather than jumping to it, or the engine
    // note flutters on every little frame-to-frame wobble.
    this.swerveLoad = Phaser.Math.Linear(
      this.swerveLoad,
      Phaser.Math.Clamp(pxPerSec / CONFIG.ENGINE_MAX_PXPS, 0, 1),
      0.12
    );

    // The engine answers to the gear first and to swerving second - it
    // should roar because you changed up, not only because you jinked.
    const topGear = CONFIG.GEAR_SPEEDS[CONFIG.GEAR_SPEEDS.length - 1];
    const throttleNorm = (this.speedMul - 1) / (topGear - 1);
    this.engineLoad = Phaser.Math.Clamp(
      throttleNorm * 0.8 + this.swerveLoad * 0.4, 0, 1);

    this.sfx.setEngineLoad(this.engineLoad);

    // --- 2bb. Speedometer -------------------------------------------
    // The needle reads the world's actual speed, so changing gear visibly
    // moves it. Swerving still adds a little on top.
    const kph = CONFIG.GAUGE_CRUISE_KPH * this.speedMul
              + this.swerveLoad * CONFIG.GAUGE_SWERVE_KPH;

    // Where that speed sits on the dial, as 0..1 of full scale, then mapped
    // onto the needle's sweep either side of straight up. Clamped so a
    // retuned speed range can never swing the needle off the dial.
    const fullScale = Phaser.Math.Clamp(kph / CONFIG.GAUGE_MAX_KPH, 0, 1);
    this.gaugeNeedle.rotation = Phaser.Math.DegToRad(
      -CONFIG.GAUGE_SWEEP / 2 + fullScale * CONFIG.GAUGE_SWEEP
    );
    this.gaugeText.setText(Math.round(kph));

    // --- 2c. Shadow and exhaust -------------------------------------
    // The shadow tracks the car, offset a little so the light reads as
    // coming from the front-left, and matches its bounce.
    this.carShadow.x = this.car.x + 5;
    this.carShadow.y = this.car.y + 9;
    this.carShadow.setScale(this.car.scaleX, this.car.scaleY);

    // Puff more often the harder the engine is working. The 0.35 floor
    // keeps a slow idle trickle going even when you're not moving.
    this.exhaustTimer -= delta * (0.35 + this.engineLoad);
    if (this.exhaustTimer <= 0) {
      this.exhaustTimer = CONFIG.EXHAUST_MS;
      this.puff();
    }

    // --- 3. Scroll the scenery to fake forward motion ---------------
    const scroll = CONFIG.SCROLL_SPEED * this.speedMul * (delta / 1000);

    this.laneDashes.forEach(dash => {
      dash.y += scroll;
      if (dash.y > H + 40) dash.y = -40;    // wrap back to the top
    });

    this.props.forEach(prop => {
      prop.y += scroll * 0.85;   // a little slower than the road = depth
      // Recycle with a random extra gap above the screen, so props arrive
      // occasionally rather than in a steady procession.
      if (prop.y > H + 60) {
        this.placeProp(prop, -60 - Phaser.Math.Between(0, CONFIG.PROP_GAP_MAX));
      }
    });

    // --- 3a. Bubbles fall at the world's current speed ---------------
    // Every bubble is set to the SAME speed every frame. That's what keeps
    // the gaps between them fixed while you brake and accelerate: they all
    // change together, so nothing can close on the one ahead.
    const bubbleSpeed = CONFIG.BUBBLE_SPEED * this.speedMul;
    this.bubbles.getChildren().forEach(b => {
      if (b.body && b.body.enable) b.body.setVelocityY(bubbleSpeed);
    });

    // Spawn once enough ROAD has gone by, rather than once enough time has.
    // Distance is the thing the spacing actually depends on, so measuring it
    // directly keeps bubbles apart at any speed.
    if (this.deck.length > 0) {
      this.distanceSinceSpawn += bubbleSpeed * (delta / 1000);

      if (this.distanceSinceSpawn >= this.nextGapPx
          && this.bubbles.getLength() < CONFIG.MAX_ACTIVE_BUBBLES) {
        this.spawnBubble();
        this.distanceSinceSpawn = 0;
        this.nextGapPx = Phaser.Math.Between(CONFIG.GAP_MIN_PX, CONFIG.GAP_MAX_PX);
      }
    }

    // --- 3b. Let the bubbles float ----------------------------------
    // This drifts the artwork INSIDE each bubble, never the bubble itself,
    // so the physics circle stays exactly where Arcade put it. Each bubble
    // gets its own phase offset so they don't all sway in unison.
    const sway = (time / CONFIG.BUBBLE_SWAY_MS) * Math.PI * 2;
    this.bubbles.getChildren().forEach(bubble => {
      const inner = bubble.getData('inner');
      if (!inner) return;
      const phase = bubble.getData('phase');
      inner.x = Math.sin(sway + phase) * CONFIG.BUBBLE_SWAY_X;
      inner.y = Math.cos((sway + phase) * 1.6) * CONFIG.BUBBLE_BOB_Y;
    });

    // --- 4. Tidy up bubbles that fell off the bottom ----------------
    // Without this they'd pile up forever and eventually slow the game down.
    // We iterate a copy, because destroy() removes the bubble from the very
    // array we'd otherwise be walking.
    this.bubbles.getChildren().slice().forEach(bubble => {
      if (bubble.y > H + CONFIG.BUBBLE_RADIUS * 2) bubble.destroy();
    });

    // --- 5. Was that the last of the 200? ---------------------------
    if (!this.finished && this.deck.length === 0 && this.bubbles.getLength() === 0) {
      this.finished = true;
      this.showFinishBanner();
    }
  }
}


/* ---------------------------------------------------------------------
   4. BOOT THE GAME
   ------------------------------------------------------------------ */
const game = new Phaser.Game({
  type: Phaser.AUTO,          // WebGL if the device supports it, else Canvas
  parent: 'game',             // draw into the <div id="game">
  backgroundColor: '#2b2f3a',

  scale: {
    // FIT: keep our 450x800 portrait shape and scale it to fill as much of
    // the screen as possible, letterboxing the leftover space.
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width:  CONFIG.GAME_WIDTH,
    height: CONFIG.GAME_HEIGHT
  },

  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 0 },   // nothing falls on its own; we set speeds by hand
      debug: false         // flip to true to see collision boxes
    }
  },

  input: {
    activePointer: true,
    touch: { capture: true }   // stop the browser stealing the touch events
  },

  scene: [CarScene]
});

// Handy when you're tinkering: open the browser console and you can reach
// the live game, e.g.  game.scene.keys.CarScene.score
window.game = game;
</script>

</html>
