ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // Pinned here so the app module and the AdMob plugin compile against the
    // same Google Mobile Ads library. The plugin depends on it internally,
    // but internal dependencies are not passed on to whoever uses the
    // plugin - so MainActivity, which sets the child-directed advert rules,
    // could not see the classes at all and the build failed.
    //
    // Setting it in one place means the two can never drift onto different
    // versions, which produces far stranger errors than a missing class.
    playServicesAdsVersion = '25.4.+'
}